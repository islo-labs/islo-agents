[job]
name = "islo-verify"
version = "0.1.0"
description = "Empirical E2E verification of a PR against a full running stack."

[job.params.repo]
type = "string"
required = true
description = "GitHub repository in owner/name form."
pattern = "^[^/]+/[^/]+$"

[job.params.pr_number]
type = "integer"
required = true
description = "Pull request number to verify."

[job.params.head_ref]
type = "string"
required = true
description = "PR head branch name."

[job.params.base_ref]
type = "string"
required = true
description = "PR base branch name."

[job.params.pr_title]
type = "string"
required = true
description = "PR title for context."

[job.params.related_prs]
type = "string"
default = ""
description = "Comma-separated repo:ref pairs for multi-repo verification."

[job.params.sandbox_name]
type = "string"
required = true
description = "Stable PR-scoped sandbox name."
pattern = "^islo-verify-[a-f0-9]{12}-[0-9]+$"

[job.params.agents_ref]
type = "string"
required = true
description = "islo-agents git ref to run."
pattern = "^[a-zA-Z0-9._/@^~-]+$"

[job.params.boot_command]
type = "string"
default = "launch-fullstack ${LAUNCH_ARGS}"
description = "Shell command to boot the stack. Supports ${REPO}, ${PR_NUMBER}, ${LAUNCH_ARGS} substitution."

[job.params.env_file]
type = "string"
default = "/workspace/.fullstack-env"
description = "Path to env file to source before running the agent."

[job.params.model]
type = "string"
default = "claude-opus-4-6"
description = "Claude model for the verify agent."

[job.params.max_turns]
type = "integer"
default = 80
description = "Maximum agentic turns."

[job.params.max_budget_usd]
type = "number"
default = 20
description = "Maximum budget in USD."

[run]
fail_fast = true
fanout = false
timeout = 2700
workdir = "/workspace"
teardown_on_complete = false

[run.sandbox]
mode = "ensure"
name = "{{sandbox_name}}"
image = "docker.io/library/islo-runner:latest"
snapshot_name = "islo-fullstack"
vcpus = 8
memory_mb = 16384
gateway_profile = "default"
init = { type = "full" }

[run.sandbox.lifecycle]
pause_after_idle = 1800
delete_after = 604800

[[run.tasks]]
name = "verify"

[[run.tasks.steps]]
name = "boot-stack"
timeout = 600
exec = [
  "bash",
  "-lc",
  '''
set -euo pipefail
REPO="$(echo "{{repo}}" | cut -d/ -f2)"
PR_NUMBER="{{pr_number}}"
RELATED_PRS="{{related_prs}}"
BOOT_COMMAND="{{boot_command}}"

LAUNCH_ARGS="--${REPO} pr/${PR_NUMBER}"
if [ -n "${RELATED_PRS}" ]; then
  IFS=',' read -ra PAIRS <<< "${RELATED_PRS}"
  for pair in "${PAIRS[@]}"; do
    repo_name="${pair%%:*}"
    ref="${pair#*:}"
    LAUNCH_ARGS="${LAUNCH_ARGS} --${repo_name} ${ref}"
  done
fi
export LAUNCH_ARGS REPO PR_NUMBER RELATED_PRS

RESOLVED_CMD=$(envsubst '${REPO} ${PR_NUMBER} ${LAUNCH_ARGS} ${RELATED_PRS}' <<< "${BOOT_COMMAND}")
echo "Running boot command: ${RESOLVED_CMD}"
source ~/.bashrc 2>/dev/null || true
eval "${RESOLVED_CMD}"
''',
]

[[run.tasks.steps]]
name = "run-agent"
timeout = 2400
exec = [
  "bash",
  "-lc",
  '''
set -euo pipefail
cd /workspace
rm -rf islo-agents
git clone --depth=1 --no-checkout https://github.com/islo-labs/islo-agents.git
cd islo-agents
git fetch --depth=1 origin "{{agents_ref}}"
git -c advice.detachedHead=false checkout FETCH_HEAD
npm ci
REPO_SHORT="$(echo "{{repo}}" | cut -d/ -f2)"
ENV_FILE="{{env_file}}"
[ -f "${ENV_FILE}" ] && source "${ENV_FILE}" || true
npx tsx src/agent.ts \
  --prompt verify/prompt.md \
  --cwd "/workspace/${REPO_SHORT}" \
  --model "{{model}}" \
  --max-turns "{{max_turns}}" \
  --max-budget "{{max_budget_usd}}" \
  --context-file "/workspace/${REPO_SHORT}/REVIEW.md" \
  --context-file "/workspace/${REPO_SHORT}/VERIFY.md" \
  --var REPO="{{repo}}" \
  --var REPO_SHORT="${REPO_SHORT}" \
  --var PR_NUMBER="{{pr_number}}" \
  --var HEAD_REF="{{head_ref}}" \
  --var BASE_REF="{{base_ref}}" \
  --var PR_TITLE="{{pr_title}}" \
  --var RELATED_PRS="{{related_prs}}"
''',
]

[[run.tasks.steps]]
name = "pause-sandbox"
pause = true
