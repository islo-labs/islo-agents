[manager]
name = "factory-operator"
description = "Handles blocked and exhausted feature-delivery runs."
harness = "claude"
model = "claude-sonnet-4-6"

[instructions]
text = """
Manage feature-delivery runs conservatively. When a stage reports blocked,
inspect the run history and external issue or pull-request state. Retry the
blocked stage only when its dependency is available. Otherwise cancel the run
with a concrete reason for the human operator.
"""

[tools]
enabled = ["jobs.run"]

[scope]
type = "lines"
lines = ["feature-delivery"]
