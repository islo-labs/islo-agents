[job]
name = "mention-handler"
version = "0.1.0"
description = "Handle human mentions from GitHub, Linear, and future chat integrations."

[job.params.source]
type = "string"
required = true
description = "Source system that sent the mention event."
pattern = "^(github|linear|slack)$"

[job.params.event_type]
type = "string"
required = true
description = "Source-specific event type, such as issue_comment or review_comment."
pattern = "^[a-zA-Z0-9_.-]+$"

[job.params.raw_payload]
type = "string"
required = true
description = "Raw webhook payload JSON."

[job.params.delivery_id]
type = "string"
default = ""
description = "External delivery ID for idempotency and debugging."

[job.params.dry_run]
type = "string"
default = "true"
description = "Whether to explain intended delegation instead of running it."
pattern = "^(true|false)$"

[job.params.agents_ref]
type = "string"
default = "v1"
description = "islo-agents git ref to run."
pattern = "^[a-zA-Z0-9._/@^~-]+$"

[job.params.model]
type = "string"
default = "claude-sonnet-4-5"
description = "Claude model for the mention handler agent."

[job.params.max_turns]
type = "integer"
default = 40
description = "Maximum agentic turns."

[job.params.max_budget_usd]
type = "number"
default = 5
description = "Maximum budget in USD."

[run]
fail_fast = true
fanout = false
timeout = 900
workdir = "/workspace"
teardown_on_complete = false

[run.sandbox]
mode = "ensure"
name = "mention-handler"
image = "docker.io/library/islo-runner:latest"
snapshot_name = "islo-stack"
vcpus = 4
memory_mb = 4096
gateway_profile = "default"
init = { type = "full" }

[run.sandbox.lifecycle]
pause_after_idle = 120

[[run.tasks]]
name = "mention-handler"

[[run.tasks.steps]]
name = "run-agent"
timeout = 900
exec = [
  "bash",
  "-lc",
  '''
set -euo pipefail
cd /workspace
mkdir -p /workspace/.islo-agents/mention-handler
cat > /workspace/.islo-agents/mention-handler/payload.json <<'EOF'
{{raw_payload}}
EOF
rm -rf islo-agents
git clone --depth=1 --no-checkout https://github.com/islo-labs/islo-agents.git
cd islo-agents
git fetch --depth=1 origin "{{agents_ref}}"
git -c advice.detachedHead=false checkout FETCH_HEAD
npm ci
npx tsx src/agent.ts \
  --prompt mention-handler/prompt.md \
  --cwd /workspace \
  --session-key "mention-handler" \
  --model "{{model}}" \
  --max-turns "{{max_turns}}" \
  --max-budget "{{max_budget_usd}}" \
  --context-file "/workspace/.islo-agents/mention-handler/payload.json" \
  --var SOURCE="{{source}}" \
  --var EVENT_TYPE="{{event_type}}" \
  --var DELIVERY_ID="{{delivery_id}}" \
  --var DRY_RUN="{{dry_run}}" \
  --var RAW_PAYLOAD_PATH="/workspace/.islo-agents/mention-handler/payload.json"
''',
]
