[line]
name = "designer-line"
description = "Design a UI request in a retained Storybook sandbox and reply with a public share. Publish is a later steer of the same stage."
category = "design"

[trigger]
type = "manual"

[limits]
max_iterations = 12
timeout = "24h"

[manager]
agent = "designer-line-manager"

[[stages]]
id = "design"
description = "The Agent starts Storybook and the share. The agent designs against the live URL. Publish is a later resume of this stage."
agent = "designer-design"
sandbox_name = "designer-{{line_run_id}}"

[stages.params.resume_prompt]
type = "string"
required = false
default = "A follow-up arrived on this design. Read /workspace/design/notes.md, share.json, and PREP.md. Apply the instruction below. Do not open a pull request unless this instruction says to publish."
description = "Complete instruction for a resumed design turn. Ignored on the first visit of this stage."

[stages.params.task]
type = "string"
required = false
default = ""
description = "Verbatim design request. Paste it as written."

[stages.outputs.design_result]
type = "string"
required = true
enum = [
    "ready",
    "blocked",
]

[stages.outputs.linear_issue_id]
type = "string"
required = true
description = "Tracker identifier when a publish resume created a backend card, or empty."

[stages.outputs.pr_url]
type = "string"
required = true
description = "Pull request URL after a publish resume, or empty."

[stages.outputs.sandbox_name]
type = "string"
required = true
description = "Ensure name of the retained sandbox."

[stages.outputs.share_url]
type = "string"
required = true
description = "Public Storybook share URL, or empty."

[stages.outputs.summary]
type = "string"
required = true
description = "Short human-readable summary of the design: what was built, where to see it, and any open question."

[[transitions]]
id = "trigger-to-design"
from = "trigger"
to = "design"
type = "conditional"

[transitions.when]
op = "always"

[transitions.params.task]
type = "input"
name = "task"

[[transitions]]
id = "design-ready"
from = "design"
to = "done"
type = "conditional"

[transitions.when]
op = "eq"

[transitions.when.left]
type = "stage"
path = "$.outputs.design_result"

[transitions.when.right]
type = "literal"
value = "ready"

[[transitions]]
id = "design-blocked"
from = "design"
type = "agentic"

[transitions.instructions]
type = "literal"
value = """
design_result was not ready. Retry design if the blocker is transient.
Cancel remains a reserved line control. Publish is also a steer of design,
only after a ready park and a human asking to ship.
"""

[[transitions.options]]
name = "retry-design"
to = "design"
label = "Retry design"

[transitions.options.params.task]
type = "input"
name = "task"
