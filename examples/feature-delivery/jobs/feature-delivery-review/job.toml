[job]
name = "feature-delivery-review"
version = "1.0.0"
description = "Review every pull request in a feature as one aggregate change"

[job.params.issue_id]
type = "string"
required = true
description = "Linear issue identifier or UUID"

[job.params.pull_requests]
type = "array"
items = "string"
required = true
description = "Complete list of GitHub pull request URLs for the feature"

[outputs.review_result]
type = "string"
required = true
enum = ["approved", "needs_changes", "blocked"]

[run]
fail_fast = true
fanout = false
timeout = 7200
workdir = "/workspace"
teardown_on_complete = false

[run.sandbox]
mode = "ensure"
name = "feature-delivery-review-{{issue_id}}"
image = "ghcr.io/islo-labs/islo-runner:latest"
snapshot_name = "feature-delivery-code"
vcpus = 4
memory_mb = 8192
gateway_profile = "default"
init = { type = "full" }

[run.sandbox.lifecycle]
pause_after_idle = 1800
delete_after = 172800

[[run.tasks]]
name = "review"

# The prompts checkout is deliberately outside the working repos the
# feature-delivery-code snapshot pre-clones under /workspace/. If your prompts
# live in one of those repos, sharing the directory would let this step's
# `checkout -f` discard the feature branch under review.
[[run.tasks.steps]]
name = "checkout-prompts"
exec = [
  "bash",
  "-lc",
  '''
set -euo pipefail
DEST=/workspace/.islo-prompts/REPLACE_WITH_REPOSITORY
git config --global url."https://x-access-token:$GH_TOKEN@github.com/".insteadOf "https://github.com/"
if [ -d "$DEST/.git" ]; then
  git -C "$DEST" fetch --depth 1 origin HEAD
  git -C "$DEST" checkout -f FETCH_HEAD
else
  mkdir -p "$(dirname "$DEST")"
  git clone --depth 1 https://github.com/REPLACE_WITH_OWNER/REPLACE_WITH_REPOSITORY.git "$DEST"
fi
''',
]

[[run.tasks.steps]]
name = "run-agent"
timeout = 7200

[run.tasks.steps.run_agent]
mode = "session"
harness = "claude"
model = "claude-sonnet-4-5"
prompt = { type = "literal", value = """
Read and follow /workspace/.islo-prompts/REPLACE_WITH_REPOSITORY/.islo/prompts/review.md,
and the gateway credential notes in integrations.md beside it.

Linear issue: {{issue_id}}
Pull requests to review as one aggregate change: {{pull_requests}}
""" }
resume_prompt = { type = "literal", value = "The pull requests have been updated. Review the latest changes across all PRs." }
session = "feature-delivery-review-{{issue_id}}"

[[run.tasks.steps]]
name = "pause-sandbox"
pause = true
