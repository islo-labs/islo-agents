[job]
name = "feature-delivery-implement"
version = "1.0.0"
description = "Implement one Linear issue as a coherent feature across one or more repositories"

[job.params.issue_id]
type = "string"
required = true
description = "Linear issue identifier or UUID"

[job.params.pull_requests]
type = "array"
items = "string"
default = []
description = "Current complete feature PR set for feedback-loop iterations"

[job.params.resume_prompt]
type = "string"
required = false
default = "Feedback arrived on the pull requests. Address all review and verification comments, update the branches, and re-run checks."
description = "Complete instruction for a resumed implementation stage"

[outputs.implementation_result]
type = "string"
required = true
enum = ["ready", "blocked"]

[outputs.pull_requests]
type = "array"
items = "string"
required = true

[run]
fail_fast = true
fanout = false
timeout = 10800
workdir = "/workspace"
teardown_on_complete = false

[run.sandbox]
mode = "ensure"
name = "feature-delivery-implement-{{issue_id}}"
image = "ghcr.io/islo-labs/islo-runner:latest"
snapshot_name = "feature-delivery-code"
vcpus = 4
memory_mb = 8192
gateway_profile = "default"
init = { type = "full" }

[run.sandbox.lifecycle]
pause_after_idle = 1800
delete_after = 172800

[[run.tasks]]
name = "implement"

[[run.tasks.steps]]
name = "run-agent"
timeout = 10800

[run.tasks.steps.run_agent]
mode = "session"
harness = "claude"
model = "claude-sonnet-4-5"
prompt = { type = "literal", value = """
Read and follow /workspace/prompts/implement.md,
and the gateway credential notes in integrations.md beside it.

Linear issue: {{issue_id}}
Current feature pull requests: {{pull_requests}}
""" }
resume_prompt = { type = "literal", value = "{{resume_prompt}}" }
session = "feature-delivery-impl-{{issue_id}}"

[[run.tasks.steps]]
name = "pause-sandbox"
pause = true
