[line]
name = "feature-delivery"
description = "Implement, review, and verify one Linear issue or standalone task across its complete pull-request set"
category = "engineering"

[trigger]
type = "integration_trigger"
provider = "linear"
name = "issue.updated"

[trigger.selector]
provider = "linear"
kind = "issue"
scope = "selected"
labels = ["REPLACE_WITH_YOUR_LINEAR_LABEL_NAME"]

[[trigger.filters]]
op = "eq"
left = { type = "trigger", path = "$.action" }
right = { type = "literal", value = "update" }

[[trigger.filters]]
op = "exists"
operand = { type = "trigger", path = "$.updatedFrom.labelIds" }

[trigger.outputs]
issue_id = { type = "trigger_path", path = "trigger.raw.data.identifier" }
work_key = { type = "trigger_path", path = "trigger.raw.data.identifier" }

[limits]
max_iterations = 20
timeout = "24h"

[agent.instructions]
type = "literal"
value = """
Preserve completed work and inspect the work request, every linked pull
request, the failed stage result, and recent line events before deciding.

The work request arrives as run params. work_key is identity only. It names
the sandbox and session and is never a requirements source. issue_id
non-empty means the run is ticket-backed: the tracker holds the requirements
and is the reporting channel. task non-empty means standalone work: task is
the verbatim requirement. origin is slack:<channel-id>:<thread-ts> for
standalone reporting. Leave origin empty on ticket-backed runs. Exactly one
of issue_id or task must be non-empty.

Retry the current stage only when the blocker is transient or external state
has changed enough to make another attempt useful. Cancel when requirements
conflict, required access or input is unavailable, the same root cause keeps
failing, or continuing could damage customer work. Explain the evidence for
the choice and do not retry merely to exhaust the iteration limit.

When steering a stage, pass the complete instruction with
--param resume_prompt='<complete instruction>'. The steering reason does not
reach the stage agent through other context. Omit resume_prompt only when
the stage default follow-up prompt is the intended instruction. The first
visit of a stage ignores resume_prompt.
"""

[[stages]]
id = "implement"
job = "feature-delivery-implement"

[[stages]]
id = "review"
job = "feature-delivery-review"

[[stages]]
id = "verify"
job = "feature-delivery-verify"

[[transitions]]
id = "trigger-to-implement"
from = "trigger"
to = "implement"
type = "conditional"

[transitions.when]
op = "always"

[transitions.params.issue_id]
type = "input"
name = "issue_id"

[transitions.params.origin]
type = "input"
name = "origin"

[transitions.params.pull_requests]
type = "input"
name = "pull_requests"

[transitions.params.task]
type = "input"
name = "task"

[transitions.params.work_key]
type = "input"
name = "work_key"

[[transitions]]
id = "implementation-ready"
from = "implement"
to = "review"
type = "conditional"

[transitions.when]
left = { type = "stage", path = "$.outputs.implementation_result" }
op = "eq"
right = { type = "literal", value = "ready" }

[transitions.params.issue_id]
type = "input"
name = "issue_id"

[transitions.params.pull_requests]
type = "output"
stage = "implement"
name = "pull_requests"

[transitions.params.task]
type = "input"
name = "task"

[transitions.params.work_key]
type = "input"
name = "work_key"

[[transitions]]
id = "implement-blocked-route"
from = "implement"
type = "agentic"

[transitions.instructions]
type = "literal"
value = """
No conditional transition matched after implement. Retry implement when the
blocker is transient. Cancel remains a reserved line control, so do not add
it as an option. A blocked retry receives the pull_requests that entered the
stage, not a new list from the failed attempt.
"""

[[transitions.options]]
name = "retry-stage"
to = "implement"
label = "Retry implementation"

[transitions.options.params.issue_id]
type = "input"
name = "issue_id"

[transitions.options.params.origin]
type = "input"
name = "origin"

[transitions.options.params.pull_requests]
type = "input"
name = "pull_requests"

[transitions.options.params.task]
type = "input"
name = "task"

[transitions.options.params.work_key]
type = "input"
name = "work_key"

[[transitions]]
id = "review-approved"
from = "review"
to = "verify"
type = "conditional"

[transitions.when]
left = { type = "stage", path = "$.outputs.review_result" }
op = "eq"
right = { type = "literal", value = "approved" }

[transitions.params.acceptance_criteria]
type = "output"
stage = "implement"
name = "acceptance_criteria"

[transitions.params.issue_id]
type = "input"
name = "issue_id"

[transitions.params.origin]
type = "input"
name = "origin"

[transitions.params.pull_requests]
type = "output"
stage = "implement"
name = "pull_requests"

[transitions.params.task]
type = "input"
name = "task"

[transitions.params.work_key]
type = "input"
name = "work_key"

[[transitions]]
id = "review-needs-changes"
from = "review"
to = "implement"
type = "conditional"
max_iterations = 3

[transitions.when]
left = { type = "stage", path = "$.outputs.review_result" }
op = "eq"
right = { type = "literal", value = "needs_changes" }

[transitions.params.issue_id]
type = "input"
name = "issue_id"

[transitions.params.origin]
type = "input"
name = "origin"

[transitions.params.pull_requests]
type = "output"
stage = "implement"
name = "pull_requests"

[transitions.params.task]
type = "input"
name = "task"

[transitions.params.work_key]
type = "input"
name = "work_key"

[[transitions]]
id = "review-blocked-route"
from = "review"
type = "agentic"

[transitions.instructions]
type = "literal"
value = """
No conditional transition matched after review. Retry review when missing
context or infrastructure is transient. Cancel remains a reserved line control.
"""

[[transitions.options]]
name = "retry-stage"
to = "review"
label = "Retry review"

[transitions.options.params.issue_id]
type = "input"
name = "issue_id"

[transitions.options.params.pull_requests]
type = "output"
stage = "implement"
name = "pull_requests"

[transitions.options.params.task]
type = "input"
name = "task"

[transitions.options.params.work_key]
type = "input"
name = "work_key"

[[transitions]]
id = "verification-passed"
from = "verify"
to = "done"
type = "conditional"

[transitions.when]
left = { type = "stage", path = "$.outputs.verification_result" }
op = "eq"
right = { type = "literal", value = "passed" }

[[transitions]]
id = "verification-failed"
from = "verify"
to = "implement"
type = "conditional"
max_iterations = 2

[transitions.when]
left = { type = "stage", path = "$.outputs.verification_result" }
op = "eq"
right = { type = "literal", value = "failed" }

[transitions.params.issue_id]
type = "input"
name = "issue_id"

[transitions.params.origin]
type = "input"
name = "origin"

[transitions.params.pull_requests]
type = "output"
stage = "implement"
name = "pull_requests"

[transitions.params.task]
type = "input"
name = "task"

[transitions.params.work_key]
type = "input"
name = "work_key"

[[transitions]]
id = "verify-blocked-route"
from = "verify"
type = "agentic"

[transitions.instructions]
type = "literal"
value = """
No conditional transition matched after verify. Retry verify when
infrastructure or credentials are transiently unavailable. Cancel remains a
reserved line control.
"""

[[transitions.options]]
name = "retry-stage"
to = "verify"
label = "Retry verification"

[transitions.options.params.acceptance_criteria]
type = "output"
stage = "implement"
name = "acceptance_criteria"

[transitions.options.params.issue_id]
type = "input"
name = "issue_id"

[transitions.options.params.origin]
type = "input"
name = "origin"

[transitions.options.params.pull_requests]
type = "output"
stage = "implement"
name = "pull_requests"

[transitions.options.params.task]
type = "input"
name = "task"

[transitions.options.params.work_key]
type = "input"
name = "work_key"
