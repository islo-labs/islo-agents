[line]
name = "feature-delivery"
description = "Implement, review, and verify one Linear issue or standalone task across its complete pull-request set"
category = "engineering"

[trigger]
type = "integration_trigger"
provider = "linear"
name = "issue.updated"

[trigger.selector]
provider = "linear"
kind = "issue"
scope = "selected"
labels = [
    "REPLACE_WITH_YOUR_LINEAR_LABEL_NAME",
]

[[trigger.filters]]
op = "eq"

[trigger.filters.left]
type = "trigger"
path = "$.action"

[trigger.filters.right]
type = "literal"
value = "update"

[[trigger.filters]]
op = "exists"

[trigger.filters.operand]
type = "trigger"
path = "$.updatedFrom.labelIds"

[trigger.outputs.issue_id]
type = "trigger_path"
path = "trigger.raw.data.identifier"

[limits]
max_iterations = 20
timeout = "24h"

[manager]
agent = "feature-delivery-manager"

[[stages]]
id = "implement"
agent = "feature-delivery-implement"
sandbox_name = "feature-delivery-implement-{{line_run_id}}"

[stages.params.issue_id]
type = "string"
required = false
default = ""
description = "Linear issue identifier when this work is ticket-backed. Non-empty means the tracker holds the requirements. Leave empty for standalone work, which takes its requirements from task."

[stages.params.pull_requests]
type = "array"
items = "string"
default = []
description = "Current complete feature PR set for feedback-loop iterations"

[stages.params.follow_up]
type = "string"
required = false
default = ""
description = "Additional instruction for this visit, included with the current PR set and requirements on initial visits and continuations."

[stages.params.task]
type = "string"
required = false
default = ""
description = "Verbatim requirement text when there is no ticket. Leave empty when issue_id is set. Exactly one of task or issue_id must be non-empty."

[stages.outputs.acceptance_criteria]
type = "array"
items = "string"
required = true
description = "Checkable acceptance criteria for verify. Empty only when the work cannot be tested."

[stages.outputs.implementation_result]
type = "string"
required = true
enum = [
    "ready",
    "blocked",
]

[stages.outputs.pull_requests]
type = "array"
items = "string"
required = true

[stages.outputs.summary]
type = "string"
required = true
description = "Short human-readable summary of what was implemented, which pull requests carry it, and any assumption or open question."

[[stages]]
id = "review"
agent = "feature-delivery-review"
sandbox_name = "feature-delivery-review-{{line_run_id}}"

[stages.params.issue_id]
type = "string"
required = false
default = ""
description = "Linear issue identifier when this work is ticket-backed. Empty for standalone work, which takes requirements from task."

[stages.params.pull_requests]
type = "array"
items = "string"
required = true
description = "Complete list of GitHub pull request URLs for the feature"

[stages.params.follow_up]
type = "string"
required = false
default = ""
description = "Additional instruction for this visit, included with the current PR set and requirements on initial visits and continuations."

[stages.params.task]
type = "string"
required = false
default = ""
description = "Verbatim requirement text when there is no ticket. Leave empty when issue_id is set."

[stages.outputs.review_result]
type = "string"
required = true
enum = [
    "approved",
    "needs_changes",
    "blocked",
]

[stages.outputs.summary]
type = "string"
required = true
description = "Short human-readable review summary: the verdict and the findings that matter."

[[stages]]
id = "verify"
agent = "feature-delivery-verify"
sandbox_name = "feature-delivery-verify-{{line_run_id}}"

[stages.params.acceptance_criteria]
type = "array"
items = "string"
default = []
description = "Checkable acceptance criteria from implement. Non-empty rows are mandatory verify scenarios."

[stages.params.issue_id]
type = "string"
required = false
default = ""
description = "Linear issue identifier when this work is ticket-backed. Empty for standalone work."

[stages.params.pull_requests]
type = "array"
items = "string"
required = true
description = "Complete list of GitHub pull request URLs for the feature"

[stages.params.follow_up]
type = "string"
required = false
default = ""
description = "Additional instruction for this visit, included with the current PR set and requirements on initial visits and continuations."

[stages.params.task]
type = "string"
required = false
default = ""
description = "Verbatim requirement text when there is no ticket. Leave empty when issue_id is set."

[stages.outputs.verification_result]
type = "string"
required = true
enum = [
    "passed",
    "failed",
    "blocked",
]

[stages.outputs.summary]
type = "string"
required = true
description = "Short human-readable verification summary: what was verified, the verdict, and what could not be observed."

[[transitions]]
id = "trigger-to-implement"
from = "trigger"
to = "implement"
type = "conditional"

[transitions.when]
op = "always"

[transitions.params.issue_id]
type = "input"
name = "issue_id"

[transitions.params.pull_requests]
type = "input"
name = "pull_requests"

[transitions.params.task]
type = "input"
name = "task"

[[transitions]]
id = "implementation-ready"
from = "implement"
to = "review"
type = "conditional"

[transitions.when]
op = "eq"

[transitions.when.left]
type = "stage"
path = "$.outputs.implementation_result"

[transitions.when.right]
type = "literal"
value = "ready"

[transitions.params.issue_id]
type = "input"
name = "issue_id"

[transitions.params.pull_requests]
type = "output"
stage = "implement"
name = "pull_requests"

[transitions.params.task]
type = "input"
name = "task"

[[transitions]]
id = "implement-blocked-route"
from = "implement"
type = "agentic"

[transitions.instructions]
type = "literal"
value = """
No conditional transition matched after implement. Retry implement when the
blocker is transient. Cancel remains a reserved line control, so do not add
it as an option. A blocked retry receives the pull_requests that entered the
stage, not a new list from the failed attempt.
"""

[[transitions.options]]
name = "retry-stage"
to = "implement"
label = "Retry implementation"

[transitions.options.params.issue_id]
type = "input"
name = "issue_id"

[transitions.options.params.pull_requests]
type = "input"
name = "pull_requests"

[transitions.options.params.task]
type = "input"
name = "task"

[[transitions]]
id = "review-approved"
from = "review"
to = "verify"
type = "conditional"

[transitions.when]
op = "eq"

[transitions.when.left]
type = "stage"
path = "$.outputs.review_result"

[transitions.when.right]
type = "literal"
value = "approved"

[transitions.params.acceptance_criteria]
type = "output"
stage = "implement"
name = "acceptance_criteria"

[transitions.params.issue_id]
type = "input"
name = "issue_id"

[transitions.params.pull_requests]
type = "output"
stage = "implement"
name = "pull_requests"

[transitions.params.task]
type = "input"
name = "task"

[[transitions]]
id = "review-needs-changes"
from = "review"
to = "implement"
type = "conditional"
max_iterations = 3

[transitions.when]
op = "eq"

[transitions.when.left]
type = "stage"
path = "$.outputs.review_result"

[transitions.when.right]
type = "literal"
value = "needs_changes"

[transitions.params.issue_id]
type = "input"
name = "issue_id"

[transitions.params.pull_requests]
type = "output"
stage = "implement"
name = "pull_requests"

[transitions.params.task]
type = "input"
name = "task"

[[transitions]]
id = "review-blocked-route"
from = "review"
type = "agentic"

[transitions.instructions]
type = "literal"
value = """
No conditional transition matched after review. Retry review when missing
context or infrastructure is transient. Cancel remains a reserved line control.
"""

[[transitions.options]]
name = "retry-stage"
to = "review"
label = "Retry review"

[transitions.options.params.issue_id]
type = "input"
name = "issue_id"

[transitions.options.params.pull_requests]
type = "output"
stage = "implement"
name = "pull_requests"

[transitions.options.params.task]
type = "input"
name = "task"

[[transitions]]
id = "verification-passed"
from = "verify"
to = "done"
type = "conditional"

[transitions.when]
op = "eq"

[transitions.when.left]
type = "stage"
path = "$.outputs.verification_result"

[transitions.when.right]
type = "literal"
value = "passed"

[[transitions]]
id = "verification-failed"
from = "verify"
to = "implement"
type = "conditional"
max_iterations = 2

[transitions.when]
op = "eq"

[transitions.when.left]
type = "stage"
path = "$.outputs.verification_result"

[transitions.when.right]
type = "literal"
value = "failed"

[transitions.params.issue_id]
type = "input"
name = "issue_id"

[transitions.params.pull_requests]
type = "output"
stage = "implement"
name = "pull_requests"

[transitions.params.task]
type = "input"
name = "task"

[[transitions]]
id = "verify-blocked-route"
from = "verify"
type = "agentic"

[transitions.instructions]
type = "literal"
value = """
No conditional transition matched after verify. Retry verify when
infrastructure or credentials are transiently unavailable. Cancel remains a
reserved line control.
"""

[[transitions.options]]
name = "retry-stage"
to = "verify"
label = "Retry verification"

[transitions.options.params.acceptance_criteria]
type = "output"
stage = "implement"
name = "acceptance_criteria"

[transitions.options.params.issue_id]
type = "input"
name = "issue_id"

[transitions.options.params.pull_requests]
type = "output"
stage = "implement"
name = "pull_requests"

[transitions.options.params.task]
type = "input"
name = "task"
