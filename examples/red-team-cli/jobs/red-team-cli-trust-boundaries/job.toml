[job]
name = "red-team-cli-trust-boundaries"
version = "0.3.1"
description = "Red-team trust-boundary review of your CLI (auth, tokens, SSH, update trust)"

[job.params.linear_mode]
type = "string"
required = false
default = "report"
description = "Passed through the line: create Linear issues downstream or report-only"

[outputs.report_json]
type = "string"
required = true
description = "Minified JSON security review report"

[run]
fail_fast = true
fanout = false
timeout = 3600
workdir = "/workspace"

[run.sandbox]
mode = "provision"
image = "ghcr.io/islo-labs/islo-runner:latest"
snapshot_name = "red-team-cli"
vcpus = 2
memory_mb = 4096
disk_gb = 20
gateway_profile = "default"
internet_enabled = true

[run.sandbox.env]
ANTHROPIC_DEFAULT_HAIKU_MODEL = "claude-sonnet-4-5"
ANTHROPIC_MODEL = "claude-sonnet-4-5"
ANTHROPIC_SMALL_FAST_MODEL = "claude-sonnet-4-5"
CLAUDE_CODE_DISABLE_EXPERIMENTAL_BETAS = "1"

[[run.tasks]]
name = "review"

[[run.tasks.steps]]
name = "trust-boundaries-review"

[run.tasks.steps.run_agent]
mode = "session"
harness = "claude"
model = "claude-sonnet-4-5"
prompt = { type = "knowledge", slug = "red-team-cli-trust-boundaries-prompt" }
