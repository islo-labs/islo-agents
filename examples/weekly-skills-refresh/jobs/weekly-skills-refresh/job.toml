[job]
name = "weekly-skills-refresh"
version = "0.7.0"
description = "Review recent product repo changes and refresh your agent skills repository when guidance is stale"

[job.params.org]
type = "string"
default = "your-org"
description = "GitHub organization that owns the product repos baked into the snapshot"

[job.params.repos]
type = "string"
default = "auto"
description = "Reserved for filtering. auto scans every git repo already in the snapshot except the skills checkout."

[job.params.branch_prefix]
type = "string"
default = "factory/skills-refresh"
description = "Branch name prefix for PRs"

[job.params.publish_mode]
type = "string"
default = "pr"
description = "How to publish updates: pr, commit, or report"

[job.params.since]
type = "string"
default = "7 days ago"
description = "Human-readable lookback window for product repo changes"

[job.params.skills_repo]
type = "string"
default = "your-org/agent-skills"
description = "Target skills repo to refresh (owner/name)"

[job.params.skills_globs]
type = "string"
default = "skills/**"
description = "Space-separated globs (relative to the skills repo root) the agent may edit. Narrow this to the paths agents actually read."

[job.params.commit_message]
type = "string"
default = "chore: refresh agent skills from product changes"
description = "Git commit message when publishing changes"

[outputs.summary]
type = "string"
required = true
description = "Short human-readable summary of the refresh"

[run]
fail_fast = true
fanout = false
concurrency = 1
timeout = 1800

[run.sandbox]
mode = "provision"
image = "ghcr.io/islo-labs/islo-runner:latest"
snapshot_name = "skills-refresh"
gateway_profile = "default"
vcpus = 2
memory_mb = 4096
disk_gb = 20
internet_enabled = true

[run.sandbox.env]
ORG = "{{org}}"
REPOS = "{{repos}}"
SKILLS_REPO = "{{skills_repo}}"
SINCE = "{{since}}"
PUBLISH_MODE = "{{publish_mode}}"
BRANCH_PREFIX = "{{branch_prefix}}"
SKILLS_GLOBS = "{{skills_globs}}"
COMMIT_MESSAGE = "{{commit_message}}"
GIT_COMMITTER_NAME = "Factory Agent"
GIT_COMMITTER_EMAIL = "factory-agent@users.noreply.github.com"
ANTHROPIC_DEFAULT_HAIKU_MODEL = "claude-sonnet-4-5"
ANTHROPIC_MODEL = "claude-sonnet-4-5"
ANTHROPIC_SMALL_FAST_MODEL = "claude-sonnet-4-5"
CLAUDE_CODE_DISABLE_EXPERIMENTAL_BETAS = "1"

[[run.tasks]]
name = "refresh"

[[run.tasks.steps]]
name = "checkout-skills"
exec = ["bash", "-lc", """
set -euo pipefail
mkdir -p /workspace
cd /workspace
if [ ! -d skills/.git ]; then
  rm -rf skills
  gh repo clone {{skills_repo}} skills
else
  cd skills
  git checkout main || git checkout master
  git pull --ff-only
fi
"""]

[[run.tasks.steps]]
name = "collect-changes"
exec = ["bash", "-lc", """
set -euo pipefail
cd /workspace
export SINCE_ISO=$(date -u -d "{{since}}" +%Y-%m-%dT%H:%M:%SZ 2>/dev/null || date -u -v-7d +%Y-%m-%dT%H:%M:%SZ)
python3 - <<'PY'
import json, os, subprocess
from pathlib import Path

since = os.environ.get("SINCE_ISO") or os.environ.get("SINCE") or "7 days ago"
repos = []
seen = set()

def add_repo(root: Path) -> None:
    if root.name == "skills" or str(root) in seen:
        return
    seen.add(str(root))
    try:
        log = subprocess.check_output(
            ["git", "-C", str(root), "log", f"--since={since}", "--pretty=format:%h\\t%s\\t%an\\t%aI", "-n", "100"],
            text=True,
            stderr=subprocess.DEVNULL,
        ).strip()
        if not log:
            return
        commits = []
        for line in log.splitlines():
            parts = line.split("\\t", 3)
            if len(parts) != 4:
                continue
            sha, msg, author, date = parts
            commits.append({"sha": sha, "message": msg, "author": author, "date": date})
        repos.append({"repo": root.name, "path": str(root), "commits": commits})
    except Exception:
        return

for pattern in ("*/.git", "*/*/.git"):
    for gitdir in sorted(Path("/workspace").glob(pattern)):
        if gitdir.is_dir():
            add_repo(gitdir.parent)

Path("/workspace/changes.json").write_text(json.dumps({"since": since, "repos": repos}, indent=2) + "\\n")
print(f"Collected {len(repos)} repos into /workspace/changes.json")
PY
"""]

[[run.tasks.steps]]
name = "refresh"

[run.tasks.steps.run_agent]
mode = "session"
harness = "claude"
model = "claude-sonnet-4-5"
prompt = { type = "literal", value = '''
You are running a scheduled **agent skills refresh** Factory job.

## Purpose

`/workspace/skills` teaches coding agents **how to work with your product correctly**. It is not a changelog or release-notes feed.

Only update skill docs when a product change would cause an agent to **work differently** than the current skill text says.

## Already done

- Skills repo is checked out at `/workspace/skills`.
- `/workspace/changes.json` lists commits already present in the snapshot's product checkouts. Do not treat a missing remote update as a skill gap. If the snapshot looks stale, say so in `summary` and make no edits.

## Parameters (sandbox env)

| Variable | Meaning |
|----------|---------|
| `ORG` | GitHub org that owns the product repos |
| `REPOS` | `auto` scans snapshot checkouts. Set a filter only if you extend the collect step. |
| `SKILLS_REPO` | GitHub `owner/repo` already cloned at `/workspace/skills` |
| `SINCE` | Lookback window |
| `PUBLISH_MODE` | `pr`, `commit`, or `report`. A later step publishes. You do not. |
| `SKILLS_GLOBS` | Space-separated globs you may edit under the skills repo |
| `BRANCH_PREFIX` / `COMMIT_MESSAGE` | Used by the publish step, not by you |

## Workflow

1. Read `/workspace/changes.json` and the skill files those commits might invalidate.
2. Edit only paths matching `SKILLS_GLOBS`.
3. Do not commit, push, or open a pull request.
4. Return `summary`: what you changed, or why no edits were needed.

## Decision rules

**Edit only if ALL are true:**
1. A concrete product change affects agent-facing behavior (CLI, API, SDK, config, auth, deployment, integrations).
2. Current skill text would mislead an agent or omit a workflow they need.
3. The fix is durable guidance, not a changelog entry.

**Do NOT edit for:** release notes, internal refactors, tests/CI-only changes, cosmetic UX, restating already-correct docs, speculative updates from commit titles alone.

**Default when uncertain:** make **no** file edits.
''' }

[[run.tasks.steps]]
name = "publish"
exec = ["bash", "-lc", """
set -euo pipefail
cd /workspace/skills
gh auth setup-git
git config user.email "factory-agent@users.noreply.github.com"
git config user.name "Factory Agent"
if git diff --cached --quiet && git diff --quiet; then
  echo "No changes to publish" | tee /workspace/publish-result.txt
  exit 0
fi
BRANCH="{{branch_prefix}}/$(date -u +%Y-%m-%d-%H%M%S)"
git checkout -b "$BRANCH"
git add -A
git commit -m "{{commit_message}}"
if [ "{{publish_mode}}" = "commit" ]; then
  git push origin HEAD:main
  URL="https://github.com/{{skills_repo}}/commit/$(git rev-parse HEAD)"
elif [ "{{publish_mode}}" = "pr" ]; then
  git push -u origin "$BRANCH"
  URL=$(gh pr create --repo {{skills_repo}} --title "Skills refresh $(date -u +%Y-%m-%d)" --body "Automated refresh from product changes over {{since}}." --head "$BRANCH")
else
  URL="report-only"
fi
echo "$URL" | tee /workspace/publish-result.txt
"""]
