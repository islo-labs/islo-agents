[job]
name = "qa-slack-notify"
version = "1.0.0"
description = "Post the QA Slack message"

[job.params.slack_channel_id]
type = "string"
required = true
description = "Slack channel ID for chat.postMessage"

[job.params.slack_text]
type = "string"
required = true
description = "Entire Slack message from the collector"

[run]
fail_fast = true
fanout = false
timeout = 300
workdir = "/workspace"

[run.sandbox]
mode = "provision"
image = "ghcr.io/islo-labs/islo-runner:latest"
vcpus = 1
memory_mb = 1024
disk_gb = 5
gateway_profile = "default"
internet_enabled = true

[run.sandbox.env]
SLACK_NOTIFY_CHANNEL_ID = "{{slack_channel_id}}"
SLACK_NOTIFY_TEXT = "{{slack_text}}"

[[run.tasks]]
name = "notify"

[[run.tasks.steps]]
name = "post-slack"
exec = ["python3", "-c", """
import json, os, sys, urllib.request
channel = (os.environ.get("SLACK_NOTIFY_CHANNEL_ID") or "").strip()
text = os.environ.get("SLACK_NOTIFY_TEXT") or ""
token = (os.environ.get("SLACK_TOKEN") or os.environ.get("SLACK_BOT_TOKEN") or "").strip()
if not token:
    print("ERROR: SLACK_TOKEN not set (connect Slack via islo login --tool slack)", file=sys.stderr)
    sys.exit(1)
if not channel:
    print("ERROR: slack_channel_id is required", file=sys.stderr)
    sys.exit(1)
if not text.strip():
    print("ERROR: slack_text is empty", file=sys.stderr)
    sys.exit(1)
payload = {"channel": channel, "text": text}
req = urllib.request.Request(
    "https://slack.com/api/chat.postMessage",
    data=json.dumps(payload).encode(),
    headers={"Authorization": f"Bearer {token}", "Content-Type": "application/json"},
    method="POST",
)
with urllib.request.urlopen(req, timeout=30) as resp:
    body = json.load(resp)
if not body.get("ok"):
    print(json.dumps(body), file=sys.stderr)
    sys.exit(1)
print(f"Posted to {channel} (ts={body.get('ts')})")
"""]
