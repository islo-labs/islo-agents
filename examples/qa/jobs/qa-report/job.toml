[job]
name = "qa-report"
version = "1.0.0"
description = "Aggregate QA findings and publish deduplicated results"

[run]
fail_fast = true
fanout = false
concurrency = 1
timeout = 900

[run.sandbox]
mode = "provision"
image = "ghcr.io/islo-labs/islo-runner:latest"
snapshot_name = "qa-report"
gateway_profile = "default"
environment = "qa"
vcpus = 1
memory_mb = 2048
disk_gb = 10
internet_enabled = true

[run.sandbox.env]
DRY_RUN = "1"
LOOKBACK_HOURS = "6"
MAX_ISSUES = "8"

[[run.tasks]]
name = "report"

[[run.tasks.steps]]
name = "collect-and-post"
exec = ["python3", "/opt/qa-harness/agent/collect_and_post.py"]
