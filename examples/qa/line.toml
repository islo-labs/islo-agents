[line]
name = "qa"
description = "Scheduled black-box QA against your deployed app, then a deduplicated Slack message"

[limits]
timeout = "6h"

[trigger]
type = "schedule"
cron = "0 7 * * *"
timezone = "UTC"

[[stages]]
id = "qa"
job = "qa"
description = "Run three parallel QA agents and emit one report JSON each"

[[stages]]
id = "collect"
job = "qa-report"
description = "Dedupe whatever reports arrived and emit a Slack message"

[[stages]]
id = "slack-notify"
job = "qa-slack-notify"
description = "Post the Slack message"

[[transitions]]
id = "trigger-to-qa"
from = "trigger"
to = "qa"
type = "conditional"

[transitions.when]
op = "always"

[[transitions]]
id = "qa-to-collect"
from = "qa"
to = "collect"
type = "conditional"

[transitions.when]
op = "always"

[transitions.params.cli_cross_report_json]
type = "output"
stage = "qa"
name = "cli_cross_report_json"

[transitions.params.web_core_report_json]
type = "output"
stage = "qa"
name = "web_core_report_json"

[transitions.params.web_platform_report_json]
type = "output"
stage = "qa"
name = "web_platform_report_json"

[[transitions]]
id = "collect-to-slack"
from = "collect"
to = "slack-notify"
type = "conditional"

[transitions.when]
op = "always"

[transitions.params.slack_channel_id]
type = "literal"
value = "REPLACE_WITH_YOUR_SLACK_CHANNEL_ID"

[transitions.params.slack_text]
type = "output"
stage = "collect"
name = "slack_text"

[[transitions]]
id = "slack-to-done"
from = "slack-notify"
to = "done"
type = "conditional"

[transitions.when]
op = "always"
