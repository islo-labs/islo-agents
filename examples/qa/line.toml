[line]
name = "qa"
description = "Scheduled black-box QA against your deployed app, then deduplicated reporting"

[trigger]
type = "schedule"
cron = "0 7 * * *"
timezone = "UTC"

[[stages]]
id = "qa"
job = "qa"
description = "Run three parallel QA agents and stage findings"

[[stages]]
id = "report"
job = "qa-report"
description = "Dedupe findings and publish results"

[[transitions]]
id = "trigger-to-qa"
from = "trigger"
to = "qa"
type = "conditional"

[transitions.when]
op = "always"

[[transitions]]
id = "qa-to-report"
from = "qa"
to = "report"
type = "conditional"

[transitions.when]
op = "always"

[[transitions]]
id = "report-to-done"
from = "report"
to = "done"
type = "conditional"

[transitions.when]
op = "always"
