[job]
name = "islo-babysit"
version = "0.2.0"
description = "Automatically fix CI failures on a PR branch."

[job.params.repo]
type = "string"
required = true
description = "GitHub repository in owner/name form."
pattern = "^[^/]+/[^/]+$"

[job.params.repo_name]
type = "string"
required = true
description = "Repository name without owner, used in the sandbox name."
pattern = "^[a-z0-9][a-z0-9._-]*$"

[job.params.workflow_run_id]
type = "string"
required = true
description = "GitHub Actions workflow run ID that failed."

[job.params.head_ref]
type = "string"
default = ""
description = "PR head branch name. Resolved from the failed run when empty."

[job.params.head_repository]
type = "string"
default = ""
description = "full_name of the workflow head repository. Used to skip fork PRs."

[job.params.agents_ref]
type = "string"
default = "v1"
description = "islo-agents git ref to run."
pattern = "^[a-zA-Z0-9._/@^~-]+$"

[job.params.model]
type = "string"
default = "claude-opus-4-6"
description = "Claude model for the babysit agent."

[job.params.max_turns]
type = "integer"
default = 50
description = "Maximum agentic turns."

[job.params.max_budget_usd]
type = "number"
default = 10
description = "Maximum budget in USD."

[run]
fail_fast = true
fanout = false
timeout = 900
workdir = "/workspace"
teardown_on_complete = false

[run.sandbox]
mode = "ensure"
name = "babysit-{{repo_name}}-{{workflow_run_id}}"
image = "docker.io/library/islo-runner:latest"
snapshot_name = "islo-stack"
vcpus = 4
memory_mb = 4096
gateway_profile = "default"
init = { type = "full" }

[run.sandbox.lifecycle]
pause_after_idle = 1800
delete_after = 604800

[[run.tasks]]
name = "babysit"

[[run.tasks.steps]]
name = "resolve-and-run"
timeout = 900
exec = [
  "bash",
  "-lc",
  '''
set -euo pipefail

REPO="{{repo}}"
RUN_ID="{{workflow_run_id}}"
HEAD_REF="{{head_ref}}"
HEAD_REPOSITORY="{{head_repository}}"
REPO_SHORT="$(echo "${REPO}" | cut -d/ -f2)"

# Skip fork PRs (same filter as the old GHA babysit workflow).
if [ -n "${HEAD_REPOSITORY}" ] && [ "${HEAD_REPOSITORY}" != "${REPO}" ]; then
  echo "Skipping babysit for fork PR head ${HEAD_REPOSITORY} (repo is ${REPO})"
  exit 0
fi

if [ -z "${HEAD_REF}" ]; then
  HEAD_REF="$(gh run view "${RUN_ID}" --repo "${REPO}" --json headBranch --jq .headBranch)"
fi

PR_JSON="$(gh pr list --repo "${REPO}" --head "${HEAD_REF}" --json number,baseRefName --limit 1)"
PR_NUMBER="$(printf '%s' "${PR_JSON}" | jq -r '.[0].number // empty')"
BASE_REF="$(printf '%s' "${PR_JSON}" | jq -r '.[0].baseRefName // empty')"
if [ -z "${PR_NUMBER}" ]; then
  echo "No open PR found for head branch ${HEAD_REF} in ${REPO}"
  exit 1
fi

cd /workspace
[ -d "${REPO_SHORT}" ] || git clone "https://github.com/${REPO}.git" "${REPO_SHORT}"
cd "${REPO_SHORT}"
git fetch origin "${HEAD_REF}"
git checkout -B "${HEAD_REF}" FETCH_HEAD

BOT_COMMITS=$(git log --oneline --author="islo-agents" -10 | wc -l | tr -d ' ')
if [ "${BOT_COMMITS}" -ge 3 ]; then
  echo "Bot has already made ${BOT_COMMITS} fix attempts. Stopping to avoid infinite loop."
  exit 0
fi

cd /workspace
rm -rf islo-agents
git clone --depth=1 --no-checkout https://github.com/islo-labs/islo-agents.git
cd islo-agents
git fetch --depth=1 origin "{{agents_ref}}"
git -c advice.detachedHead=false checkout FETCH_HEAD
npm ci
npx tsx src/agent.ts \
  --prompt agents/babysit/prompt.md \
  --cwd "/workspace/${REPO_SHORT}" \
  --model "{{model}}" \
  --max-turns "{{max_turns}}" \
  --max-budget "{{max_budget_usd}}" \
  --context-file "/workspace/${REPO_SHORT}/REVIEW.md" \
  --var REPO="${REPO}" \
  --var PR_NUMBER="${PR_NUMBER}" \
  --var RUN_ID="${RUN_ID}"
''',
]

[[run.tasks.steps]]
name = "pause-sandbox"
pause = true
