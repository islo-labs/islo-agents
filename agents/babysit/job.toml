[job]
name = "babysit"
version = "0.7.0"
description = "Automatically fix CI failures on a PR branch."

[job.params.repo]
type = "string"
required = true
description = "GitHub repository in owner/name form."
pattern = "^[^/]+/[^/]+$"

[job.params.repo_name]
type = "string"
required = true
description = "Repository name without owner (sandbox names cannot contain /)."
pattern = "^[a-z0-9][a-z0-9._-]*$"

[job.params.workflow_run_id]
type = "string"
required = true
description = "GitHub Actions workflow run ID that failed."

[job.params.head_repository]
type = "string"
default = ""
description = "full_name of the workflow head repository. Used to skip fork PRs."

[job.params.agents_git_ref]
type = "string"
default = "main"
description = "Git ref (branch, tag, or commit) of the agents pack to check out."
pattern = "^[a-zA-Z0-9._/@^~-]+$"

[job.params.harness]
type = "string"
default = "claude"
description = "Agent harness: claude or codex."
pattern = "^(claude|codex)$"

[job.params.model]
type = "string"
default = "claude-opus-4-6"
description = "Model name understood by the selected harness."

[job.params.model_provider]
type = "string"
default = ""
description = "Inference provider routed through the Islo gateway. Empty uses the harness default."

[job.params.max_turns]
type = "integer"
default = 150
description = "Maximum agentic turns (Claude only; ignored by Codex)."

[job.params.max_budget_usd]
type = "number"
default = 30
description = "Maximum USD budget. Codex converts this to an approximate rollout-token limit."

[job.params.reasoning_effort]
type = "string"
default = "high"
description = "Reasoning effort level for both harnesses. Codex uses minimal–xhigh; Claude uses low–max."
pattern = "^(minimal|low|medium|high|xhigh|max)$"

[run]
fail_fast = true
fanout = false
timeout = 2700
workdir = "/workspace"
teardown_on_complete = false

[run.sandbox]
mode = "ensure"
name = "babysit-{{repo_name}}-{{workflow_run_id}}"
image = "docker.io/library/islo-runner:latest"
snapshot_name = "islo-code"
vcpus = 4
memory_mb = 4096
gateway_profile = "default"
init = { type = "full" }

[run.sandbox.lifecycle]
pause_after_idle = 1800
delete_after = 604800

[[run.tasks]]
name = "babysit"

[[run.tasks.steps]]
name = "guard-fork"
timeout = 30
exec = [
  "bash",
  "-lc",
  '''
set -euo pipefail
mkdir -p /workspace/.islo-job
REPO="{{repo}}"
HEAD_REPOSITORY="{{head_repository}}"
if [ -n "${HEAD_REPOSITORY}" ] && [ "${HEAD_REPOSITORY}" != "${REPO}" ]; then
  echo "Skipping babysit for fork PR head ${HEAD_REPOSITORY} (repo is ${REPO})"
  echo "fork" > /workspace/.islo-job/skip
fi
''',
]

[[run.tasks.steps]]
name = "resolve-pr"
timeout = 60
exec = [
  "bash",
  "-lc",
  '''
set -euo pipefail
if [ -f /workspace/.islo-job/skip ]; then echo "skipped"; exit 0; fi
REPO="{{repo}}"
RUN_ID="{{workflow_run_id}}"
REPO_SHORT="$(echo "${REPO}" | cut -d/ -f2)"
HEAD_REF="$(gh run view "${RUN_ID}" --repo "${REPO}" --json headBranch --jq .headBranch)"
PR_NUMBER="$(gh pr list --repo "${REPO}" --head "${HEAD_REF}" --json number --jq '.[0].number // empty')"
if [ -z "${PR_NUMBER}" ]; then
  echo "No open PR found for head branch ${HEAD_REF} in ${REPO}"
  exit 1
fi
cat > /workspace/.islo-job/env <<EOF
export REPO="${REPO}"
export RUN_ID="${RUN_ID}"
export PR_NUMBER="${PR_NUMBER}"
export REPO_SHORT="${REPO_SHORT}"
EOF
''',
]

[[run.tasks.steps]]
name = "checkout-pr"
timeout = 120
exec = [
  "bash",
  "-lc",
  '''
set -euo pipefail
if [ -f /workspace/.islo-job/skip ]; then echo "skipped"; exit 0; fi
source /workspace/.islo-job/env
cd /workspace
[ -d "${REPO_SHORT}" ] || git clone "https://github.com/${REPO}.git" "${REPO_SHORT}"
cd "${REPO_SHORT}"
# Snapshot clones are often single-branch; widen fetch so PR checkout can track.
git remote set-branches origin '*'
git fetch --prune origin
# Each CI repair starts from the current remote PR head. Force-reset the reused
# local branch so a force-pushed PR cannot leave it on divergent history.
gh pr checkout "${PR_NUMBER}" --repo "${REPO}" --force
''',
]

[[run.tasks.steps]]
name = "bot-commit-guard"
timeout = 30
exec = [
  "bash",
  "-lc",
  '''
set -euo pipefail
if [ -f /workspace/.islo-job/skip ]; then echo "skipped"; exit 0; fi
source /workspace/.islo-job/env
cd "/workspace/${REPO_SHORT}"
BOT_COMMITS=$(git log --oneline --author="islo-agents" -10 | wc -l | tr -d ' ')
if [ "${BOT_COMMITS}" -ge 3 ]; then
  echo "Bot has already made ${BOT_COMMITS} fix attempts. Stopping to avoid infinite loop."
  echo "bot-limit" > /workspace/.islo-job/skip
fi
''',
]

[[run.tasks.steps]]
name = "checkout-pack"
timeout = 120
exec = [
  "bash",
  "-lc",
  '''
set -euo pipefail
if [ -f /workspace/.islo-job/skip ]; then echo "skipped"; exit 0; fi
cd /workspace
rm -rf .islo-pack
git clone --depth=1 --no-checkout https://github.com/islo-labs/islo-agents.git .islo-pack
cd .islo-pack
git fetch --depth=1 origin "{{agents_git_ref}}"
git -c advice.detachedHead=false checkout FETCH_HEAD
''',
]

[[run.tasks.steps]]
name = "install-deps"
timeout = 300
exec = [
  "bash",
  "-lc",
  '''
set -euo pipefail
if [ -f /workspace/.islo-job/skip ]; then echo "skipped"; exit 0; fi
cd /workspace/.islo-pack
npm ci
''',
]

[[run.tasks.steps]]
name = "run-agent"
timeout = 2700
exec = [
  "bash",
  "-lc",
  '''
set -euo pipefail
if [ -f /workspace/.islo-job/skip ]; then echo "skipped"; exit 0; fi
source /workspace/.islo-job/env
cd /workspace/.islo-pack
HARNESS="{{harness}}"
MODEL_PROVIDER="{{model_provider}}"
HARNESS_ARGS=(--reasoning-effort "{{reasoning_effort}}")
[ -n "${MODEL_PROVIDER}" ] && HARNESS_ARGS+=(--model-provider "${MODEL_PROVIDER}")
case "${HARNESS}" in
  claude)
    HARNESS_ARGS+=(--max-turns "{{max_turns}}")
    ;;
  codex)
    ;;
  *)
    echo "Unsupported harness: ${HARNESS}" >&2
    exit 2
    ;;
esac
npx tsx src/agent.ts \
  --prompt agents/babysit/prompt.md \
  --harness "${HARNESS}" \
  --cwd /workspace \
  --model "{{model}}" \
  --max-budget "{{max_budget_usd}}" \
  "${HARNESS_ARGS[@]}" \
  --context-file "/workspace/${REPO_SHORT}/REVIEW.md" \
  --knowledge-id islo-integrations \
  --var REPO="${REPO}" \
  --var PR_NUMBER="${PR_NUMBER}" \
  --var RUN_ID="${RUN_ID}"
''',
]

[[run.tasks.steps]]
name = "pause-sandbox"
pause = true
