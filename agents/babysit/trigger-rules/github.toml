[[rules]]

[rules.when]
op = "all"

[[rules.when.conditions]]
op = "equals"
json_path = "$.action"
value = "completed"

[[rules.when.conditions]]
op = "equals"
json_path = "$.workflow_run.conclusion"
value = "failure"

[[rules.when.conditions]]
op = "equals"
json_path = "$.workflow_run.event"
value = "pull_request"

[[rules.actions]]
action_type = "trigger_job"
job_name = "babysit"

[rules.actions.params.repo]
source = { source = "json_path", path = "$.repository.full_name" }

[rules.actions.params.repo_name]
source = { source = "json_path", path = "$.repository.name" }

[rules.actions.params.workflow_run_id]
parts = [{ type = "source", source = { source = "json_path", path = "$.workflow_run.id" } }]

[rules.actions.params.head_repository]
source = { source = "json_path", path = "$.workflow_run.head_repository.full_name" }
