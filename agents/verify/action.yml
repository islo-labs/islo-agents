name: 'Islo Verify'
description: 'Empirical E2E verification powered by Islo jobs and Claude'

inputs:
  pr_number:
    description: 'PR number to verify'
    required: true
  related_prs:
    description: 'Comma-separated repo:ref pairs for multi-repo verification (e.g. backend:pr/423,gateway:feat/billing)'
    required: false
    default: ''
  boot_command:
    description: 'Shell command to boot the stack. Supports ${REPO}, ${PR_NUMBER}, ${LAUNCH_ARGS} substitution. Set empty to skip.'
    required: false
    default: 'launch-fullstack ${LAUNCH_ARGS}'
  env_file:
    description: 'Path to env file inside the sandbox to source before running the agent'
    required: false
    default: '/workspace/.fullstack-env'
  model:
    description: 'Claude model to use (e.g., claude-opus-4-6, claude-sonnet-4)'
    required: false
    default: 'claude-opus-4-6'
  max_turns:
    description: 'Maximum agentic turns (tool-use round trips)'
    required: false
    default: '80'
  max_budget_usd:
    description: 'Stop when cost estimate reaches this USD value'
    required: false
    default: '20'

runs:
  using: 'composite'
  steps:
    - name: Install islo CLI
      shell: bash
      run: curl -fsSL https://islo.dev/install.sh | sh

    - name: Resolve PR metadata
      id: pr
      shell: bash
      env:
        REPO: ${{ github.repository }}
        PR_NUMBER: ${{ inputs.pr_number }}
      run: |
        set -euo pipefail
        PR_JSON="$(gh pr view "${PR_NUMBER}" --repo "${REPO}" --json headRefName,baseRefName,title)"
        HEAD_REF="$(printf '%s' "${PR_JSON}" | jq -r .headRefName)"
        BASE_REF="$(printf '%s' "${PR_JSON}" | jq -r .baseRefName)"
        PR_TITLE="$(printf '%s' "${PR_JSON}" | jq -r .title)"
        echo "head_ref=${HEAD_REF}" >> "${GITHUB_OUTPUT}"
        echo "base_ref=${BASE_REF}" >> "${GITHUB_OUTPUT}"
        echo "pr_title=${PR_TITLE}" >> "${GITHUB_OUTPUT}"

    - name: Verify
      shell: bash
      env:
        REPO: ${{ github.repository }}
        PR_NUMBER: ${{ inputs.pr_number }}
        HEAD_REF: ${{ steps.pr.outputs.head_ref }}
        BASE_REF: ${{ steps.pr.outputs.base_ref }}
        PR_TITLE: ${{ steps.pr.outputs.pr_title }}
        RELATED_PRS: ${{ inputs.related_prs }}
        BOOT_COMMAND: ${{ inputs.boot_command }}
        ENV_FILE: ${{ inputs.env_file }}
        AGENTS_REF: ${{ github.action_ref || 'v1' }}
        MODEL: ${{ inputs.model }}
        MAX_TURNS: ${{ inputs.max_turns }}
        MAX_BUDGET_USD: ${{ inputs.max_budget_usd }}
      run: |
        set -euo pipefail
        REPO_HASH="$(node -e 'const crypto = require("crypto"); process.stdout.write(crypto.createHash("sha256").update(process.env.REPO).digest("hex").slice(0, 12));')"
        SANDBOX_NAME="islo-verify-${REPO_HASH}-${PR_NUMBER}"
        echo "Using verify sandbox ${SANDBOX_NAME}"
        STATUS_JSON="$(islo status "${SANDBOX_NAME}" --output json 2>/dev/null || true)"
        if [ -n "${STATUS_JSON}" ]; then
          STATUS="$(printf '%s' "${STATUS_JSON}" | node -e 'const fs = require("fs"); const input = fs.readFileSync(0, "utf8"); process.stdout.write(JSON.parse(input).status || "");')"
          if [ "${STATUS}" = "failed" ]; then
            echo "Removing failed verify sandbox ${SANDBOX_NAME} before retry"
            islo rm "${SANDBOX_NAME}" --force || true
          fi
        fi
        islo job run islo-verify --watch \
          --param repo="${REPO}" \
          --param pr_number="${PR_NUMBER}" \
          --param head_ref="${HEAD_REF}" \
          --param base_ref="${BASE_REF}" \
          --param pr_title="${PR_TITLE}" \
          --param related_prs="${RELATED_PRS}" \
          --param sandbox_name="${SANDBOX_NAME}" \
          --param agents_ref="${AGENTS_REF}" \
          --param boot_command="${BOOT_COMMAND}" \
          --param env_file="${ENV_FILE}" \
          --param model="${MODEL}" \
          --param max_turns="${MAX_TURNS}" \
          --param max_budget_usd="${MAX_BUDGET_USD}"
