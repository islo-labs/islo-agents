[job]
name = "verify"
version = "0.7.0"
description = "Empirical E2E verification of a PR against a full running stack."

[job.params.repo]
type = "string"
required = true
description = "GitHub repository in owner/name form."
pattern = "^[^/]+/[^/]+$"

[job.params.repo_name]
type = "string"
required = true
description = "Repository name without owner (sandbox names cannot contain /)."
pattern = "^[a-z0-9][a-z0-9._-]*$"

[job.params.pr_number]
type = "integer"
required = true
description = "Pull request number to verify."

[job.params.related_prs]
type = "string"
default = ""
description = "Comma-separated repo:ref pairs for multi-repo verification."

[job.params.agents_git_ref]
type = "string"
default = "main"
description = "Git ref (branch, tag, or commit) of the agents pack to check out."
pattern = "^[a-zA-Z0-9._/@^~-]+$"

[job.params.boot_command]
type = "string"
default = "launch-fullstack ${LAUNCH_ARGS}"
description = "Shell command to boot the stack. Supports ${REPO}, ${PR_NUMBER}, ${LAUNCH_ARGS} substitution."

[job.params.env_file]
type = "string"
default = "/workspace/.fullstack-env"
description = "Path to env file to source before running the agent."

[job.params.harness]
type = "string"
default = "claude"
description = "Agent harness: claude or codex."
pattern = "^(claude|codex)$"

[job.params.model]
type = "string"
default = "claude-opus-4-6"
description = "Model name understood by the selected harness."

[job.params.max_turns]
type = "integer"
default = 150
description = "Maximum agentic turns (Claude only; ignored by Codex)."

[job.params.max_budget_usd]
type = "number"
default = 20
description = "Maximum USD budget. Codex converts this to an approximate rollout-token limit."

[job.params.reasoning_effort]
type = "string"
default = "high"
description = "Reasoning effort level for both harnesses. Codex uses minimal–xhigh; Claude uses low–max."
pattern = "^(minimal|low|medium|high|xhigh|max)$"

[run]
fail_fast = true
fanout = false
timeout = 2700
workdir = "/workspace"
teardown_on_complete = false

[run.sandbox]
mode = "ensure"
name = "verify-{{repo_name}}-{{pr_number}}"
image = "docker.io/library/islo-runner:latest"
snapshot_name = "islo-fullstack"
vcpus = 8
memory_mb = 16384
gateway_profile = "default"
init = { type = "full" }

[run.sandbox.lifecycle]
pause_after_idle = 1800
delete_after = 604800

[[run.tasks]]
name = "verify"

[[run.tasks.steps]]
name = "prepare-knowledge"
timeout = 30
exec = [
  "bash",
  "-lc",
  '''
set -euo pipefail
CONTEXT_DIR="/workspace/.islo/context"
mkdir -p "${CONTEXT_DIR}"
for slug in fullstack-env islo-integrations; do
  FILE="${CONTEXT_DIR}/${slug}.md"
  if [ -s "${FILE}" ]; then
    echo "Using cached ${slug} knowledge"
  else
    if islo knowledge get "${slug}" -o json | jq -er '.body' > "${FILE}.tmp"; then
      mv "${FILE}.tmp" "${FILE}"
      echo "Cached ${slug} knowledge"
    else
      rm -f "${FILE}.tmp"
      echo "Warning: ${slug} knowledge unavailable; continuing without it" >&2
    fi
  fi
done
''',
]

[[run.tasks.steps]]
name = "boot-stack"
timeout = 600
exec = [
  "bash",
  "-lc",
  '''
set -euo pipefail
REPO="$(echo "{{repo}}" | cut -d/ -f2)"
PR_NUMBER="{{pr_number}}"
RELATED_PRS="{{related_prs}}"

LAUNCH_ARGS="--${REPO} pr/${PR_NUMBER}"
if [ -n "${RELATED_PRS}" ]; then
  IFS=',' read -ra PAIRS <<< "${RELATED_PRS}"
  for pair in "${PAIRS[@]}"; do
    repo_name="${pair%%:*}"
    ref="${pair#*:}"
    LAUNCH_ARGS="${LAUNCH_ARGS} --${repo_name} ${ref}"
  done
fi
export LAUNCH_ARGS REPO PR_NUMBER RELATED_PRS

BOOT_COMMAND="{{boot_command}}"
echo "Running boot command: ${BOOT_COMMAND}"
source ~/.bashrc 2>/dev/null || true
eval "${BOOT_COMMAND}"
''',
]

[[run.tasks.steps]]
name = "checkout-pack"
timeout = 120
exec = [
  "bash",
  "-lc",
  '''
set -euo pipefail
cd /workspace
rm -rf .islo-pack
git clone --depth=1 --no-checkout https://github.com/islo-labs/islo-agents.git .islo-pack
cd .islo-pack
git fetch --depth=1 origin "{{agents_git_ref}}"
git -c advice.detachedHead=false checkout FETCH_HEAD
''',
]

[[run.tasks.steps]]
name = "install-deps"
timeout = 300
exec = [
  "bash",
  "-lc",
  '''
set -euo pipefail
cd /workspace/.islo-pack
npm ci
''',
]

[[run.tasks.steps]]
name = "run-agent"
timeout = 2400
exec = [
  "bash",
  "-lc",
  '''
set -euo pipefail
cd /workspace/.islo-pack
REPO_SHORT="$(echo "{{repo}}" | cut -d/ -f2)"
ENV_FILE="{{env_file}}"
[ -f "${ENV_FILE}" ] && source "${ENV_FILE}" || true

HARNESS="{{harness}}"
HARNESS_ARGS=(--reasoning-effort "{{reasoning_effort}}")
case "${HARNESS}" in
  claude)
    HARNESS_ARGS+=(--max-turns "{{max_turns}}")
    ;;
  codex)
    ;;
  *)
    echo "Unsupported harness: ${HARNESS}" >&2
    exit 2
    ;;
esac
npx tsx src/agent.ts \
  --prompt agents/verify/prompt.md \
  --harness "${HARNESS}" \
  --cwd /workspace \
  --model "{{model}}" \
  --max-budget "{{max_budget_usd}}" \
  "${HARNESS_ARGS[@]}" \
  --context-file "/workspace/${REPO_SHORT}/REVIEW.md" \
  --context-file "/workspace/${REPO_SHORT}/VERIFY.md" \
  --context-file "/workspace/.islo/context/fullstack-env.md" \
  --context-file "/workspace/.islo/context/islo-integrations.md" \
  --var REPO="{{repo}}" \
  --var REPO_SHORT="${REPO_SHORT}" \
  --var PR_NUMBER="{{pr_number}}" \
  --var RELATED_PRS="{{related_prs}}"
''',
]

[[run.tasks.steps]]
name = "pause-sandbox"
pause = true
