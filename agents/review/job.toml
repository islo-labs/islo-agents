[job]
name = "islo-review"
version = "0.2.0"
description = "Run automated GitHub PR code review as a durable Islo job."

[job.params.repo]
type = "string"
required = true
description = "GitHub repository in owner/name form."
pattern = "^[^/]+/[^/]+$"

[job.params.repo_name]
type = "string"
required = true
description = "Repository name without owner, used in the sandbox name."
pattern = "^[a-z0-9][a-z0-9._-]*$"

[job.params.pr_number]
type = "integer"
required = true
description = "Pull request number to review."

[job.params.head_ref]
type = "string"
default = ""
description = "PR head branch name. Resolved from the PR when empty."

[job.params.base_ref]
type = "string"
default = ""
description = "PR base branch name. Resolved from the PR when empty."

[job.params.agents_ref]
type = "string"
default = "v1"
description = "islo-agents git ref to run, for example v1 or a branch name."
pattern = "^[a-zA-Z0-9._/@^~-]+$"

[job.params.model]
type = "string"
default = "claude-opus-4-6"
description = "Claude model for the review agent."

[job.params.max_turns]
type = "integer"
default = 50
description = "Maximum agentic turns."

[job.params.max_budget_usd]
type = "number"
default = 10
description = "Maximum review budget in USD."

[run]
fail_fast = true
fanout = false
timeout = 900
workdir = "/workspace"
teardown_on_complete = false

[run.sandbox]
mode = "ensure"
name = "review-{{repo_name}}-{{pr_number}}"
image = "docker.io/library/islo-runner:latest"
snapshot_name = "islo-stack"
vcpus = 4
memory_mb = 4096
gateway_profile = "default"
init = { type = "full" }

[run.sandbox.lifecycle]
pause_after_idle = 1800
delete_after = 604800

[[run.tasks]]
name = "review"

[[run.tasks.steps]]
name = "run-reviewer"
timeout = 900
exec = [
  "bash",
  "-lc",
  '''
set -euo pipefail

REPO="{{repo}}"
PR_NUMBER="{{pr_number}}"
HEAD_REF="{{head_ref}}"
BASE_REF="{{base_ref}}"
REPO_SHORT="$(echo "${REPO}" | cut -d/ -f2)"

if [ -z "${HEAD_REF}" ] || [ -z "${BASE_REF}" ]; then
  PR_META="$(gh pr view "${PR_NUMBER}" --repo "${REPO}" --json headRefName,baseRefName)"
  [ -n "${HEAD_REF}" ] || HEAD_REF="$(printf '%s' "${PR_META}" | jq -r .headRefName)"
  [ -n "${BASE_REF}" ] || BASE_REF="$(printf '%s' "${PR_META}" | jq -r .baseRefName)"
fi

cd /workspace
[ -d "${REPO_SHORT}" ] || git clone "https://github.com/${REPO}.git" "${REPO_SHORT}"
cd "${REPO_SHORT}"
git fetch origin "${HEAD_REF}"
git checkout -B "${HEAD_REF}" FETCH_HEAD

cd /workspace
rm -rf islo-agents
git clone --depth=1 --no-checkout https://github.com/islo-labs/islo-agents.git
cd islo-agents
git fetch --depth=1 origin "{{agents_ref}}"
git -c advice.detachedHead=false checkout FETCH_HEAD
npm ci
npx tsx src/agent.ts \
  --prompt agents/review/prompt.md \
  --cwd "/workspace/${REPO_SHORT}" \
  --model "{{model}}" \
  --max-turns "{{max_turns}}" \
  --max-budget "{{max_budget_usd}}" \
  --session-key "${REPO}-${PR_NUMBER}" \
  --context-file "/workspace/${REPO_SHORT}/REVIEW.md" \
  --var REPO="${REPO}" \
  --var PR_NUMBER="${PR_NUMBER}" \
  --var HEAD_REF="${HEAD_REF}" \
  --var BASE_REF="${BASE_REF}"
''',
]

[[run.tasks.steps]]
name = "pause-sandbox"
pause = true
