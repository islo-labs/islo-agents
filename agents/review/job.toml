[job]
name = "review"
version = "0.6.0"
description = "Automated PR code review."

[job.params.repo]
type = "string"
required = true
description = "GitHub repository in owner/name form."
pattern = "^[^/]+/[^/]+$"

[job.params.repo_name]
type = "string"
required = true
description = "Repository name without owner (sandbox names cannot contain /)."
pattern = "^[a-z0-9][a-z0-9._-]*$"

[job.params.pr_number]
type = "integer"
required = true
description = "Pull request number to review."

[job.params.agents_git_ref]
type = "string"
default = "main"
description = "Git ref (branch, tag, or commit) of the agents pack to check out."
pattern = "^[a-zA-Z0-9._/@^~-]+$"

[job.params.harness]
type = "string"
default = "codex"
description = "Agent harness: claude or codex."
pattern = "^(claude|codex)$"

[job.params.model]
type = "string"
default = "gpt-5.6"
description = "Model name understood by the selected harness."

[job.params.max_turns]
type = "integer"
default = 50
description = "Claude-only maximum agentic turns."

[job.params.max_budget_usd]
type = "number"
default = 10
description = "Claude-only maximum review budget in USD."

[job.params.rollout_budget_tokens]
type = "integer"
default = 200000
description = "Codex-only weighted token budget. May overshoot by one model response."

[job.params.reasoning_effort]
type = "string"
default = "high"
description = "Codex-only reasoning effort."
pattern = "^(minimal|low|medium|high|xhigh)$"

[run]
fail_fast = true
fanout = false
timeout = 900
workdir = "/workspace"
teardown_on_complete = false

[run.sandbox]
mode = "ensure"
name = "review-{{repo_name}}-{{pr_number}}"
image = "docker.io/library/islo-runner:latest"
snapshot_name = "islo-stack"
vcpus = 4
memory_mb = 4096
gateway_profile = "default"
init = { type = "full" }

[run.sandbox.lifecycle]
pause_after_idle = 1800
delete_after = 604800

[[run.tasks]]
name = "review"

[[run.tasks.steps]]
name = "checkout-pr"
timeout = 120
exec = [
  "bash",
  "-lc",
  '''
set -euo pipefail
mkdir -p /workspace/.islo-job
REPO="{{repo}}"
PR_NUMBER="{{pr_number}}"
REPO_SHORT="$(echo "${REPO}" | cut -d/ -f2)"
cat > /workspace/.islo-job/env <<EOF
export REPO="${REPO}"
export PR_NUMBER="${PR_NUMBER}"
export REPO_SHORT="${REPO_SHORT}"
EOF
cd /workspace
[ -d "${REPO_SHORT}" ] || git clone "https://github.com/${REPO}.git" "${REPO_SHORT}"
cd "${REPO_SHORT}"
# Snapshot clones are often single-branch; widen fetch so PR checkout can track.
git remote set-branches origin '*'
git fetch --prune origin
gh pr checkout "${PR_NUMBER}" --repo "${REPO}"
''',
]

[[run.tasks.steps]]
name = "checkout-pack"
timeout = 120
exec = [
  "bash",
  "-lc",
  '''
set -euo pipefail
cd /workspace
rm -rf islo-agents
git clone --depth=1 --no-checkout https://github.com/islo-labs/islo-agents.git
cd islo-agents
git fetch --depth=1 origin "{{agents_git_ref}}"
git -c advice.detachedHead=false checkout FETCH_HEAD
''',
]

[[run.tasks.steps]]
name = "install-deps"
timeout = 300
exec = [
  "bash",
  "-lc",
  '''
set -euo pipefail
cd /workspace/islo-agents
npm ci
''',
]

[[run.tasks.steps]]
name = "run-agent"
timeout = 900
exec = [
  "bash",
  "-lc",
  '''
set -euo pipefail
source /workspace/.islo-job/env
cd /workspace/islo-agents
HARNESS="{{harness}}"
HARNESS_ARGS=()
case "${HARNESS}" in
  claude)
    HARNESS_ARGS+=(--max-turns "{{max_turns}}" --max-budget "{{max_budget_usd}}")
    ;;
  codex)
    HARNESS_ARGS+=(--rollout-budget-tokens "{{rollout_budget_tokens}}" --reasoning-effort "{{reasoning_effort}}")
    ;;
  *)
    echo "Unsupported harness: ${HARNESS}" >&2
    exit 2
    ;;
esac
npx tsx src/agent.ts \
  --prompt agents/review/prompt.md \
  --harness "${HARNESS}" \
  --cwd /workspace \
  --model "{{model}}" \
  "${HARNESS_ARGS[@]}" \
  --session-key "${REPO}-${PR_NUMBER}" \
  --context-file "/workspace/${REPO_SHORT}/REVIEW.md" \
  --knowledge-id islo-integrations \
  --var REPO="${REPO}" \
  --var PR_NUMBER="${PR_NUMBER}"
''',
]

[[run.tasks.steps]]
name = "pause-sandbox"
pause = true
