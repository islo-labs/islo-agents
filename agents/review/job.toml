[job]
name = "review"
version = "0.5.0"
description = "Automated PR code review."

[job.params.repo]
type = "string"
required = true
description = "GitHub repository in owner/name form."
pattern = "^[^/]+/[^/]+$"

[job.params.repo_name]
type = "string"
required = true
description = "Repository name without owner (sandbox names cannot contain /)."
pattern = "^[a-z0-9][a-z0-9._-]*$"

[job.params.pr_number]
type = "integer"
required = true
description = "Pull request number to review."

[job.params.agents_git_ref]
type = "string"
default = "main"
description = "Git ref (branch, tag, or commit) of the agents pack to check out."
pattern = "^[a-zA-Z0-9._/@^~-]+$"

[job.params.model]
type = "string"
default = "claude-opus-4-6"
description = "Claude model for the review agent."

[job.params.max_turns]
type = "integer"
default = 50
description = "Maximum agentic turns."

[job.params.max_budget_usd]
type = "number"
default = 10
description = "Maximum review budget in USD."

[run]
fail_fast = true
fanout = false
timeout = 900
workdir = "/workspace"
teardown_on_complete = false

[run.sandbox]
mode = "ensure"
name = "review-{{repo_name}}-{{pr_number}}"
image = "docker.io/library/islo-runner:latest"
snapshot_name = "islo-stack"
vcpus = 4
memory_mb = 4096
gateway_profile = "default"
init = { type = "full" }

[run.sandbox.lifecycle]
pause_after_idle = 1800
delete_after = 604800

[[run.tasks]]
name = "review"

[[run.tasks.steps]]
name = "checkout-pr"
timeout = 120
exec = [
  "bash",
  "-lc",
  '''
set -euo pipefail
mkdir -p /workspace/.islo-job
REPO="{{repo}}"
PR_NUMBER="{{pr_number}}"
REPO_SHORT="$(echo "${REPO}" | cut -d/ -f2)"
cat > /workspace/.islo-job/env <<EOF
export REPO="${REPO}"
export PR_NUMBER="${PR_NUMBER}"
export REPO_SHORT="${REPO_SHORT}"
EOF
cd /workspace
[ -d "${REPO_SHORT}" ] || git clone "https://github.com/${REPO}.git" "${REPO_SHORT}"
cd "${REPO_SHORT}"
gh pr checkout "${PR_NUMBER}" --repo "${REPO}"
''',
]

[[run.tasks.steps]]
name = "checkout-pack"
timeout = 120
exec = [
  "bash",
  "-lc",
  '''
set -euo pipefail
cd /workspace
rm -rf islo-agents
git clone --depth=1 --no-checkout https://github.com/islo-labs/islo-agents.git
cd islo-agents
git fetch --depth=1 origin "{{agents_git_ref}}"
git -c advice.detachedHead=false checkout FETCH_HEAD
''',
]

[[run.tasks.steps]]
name = "install-deps"
timeout = 300
exec = [
  "bash",
  "-lc",
  '''
set -euo pipefail
cd /workspace/islo-agents
npm ci
''',
]

[[run.tasks.steps]]
name = "run-agent"
timeout = 900
exec = [
  "bash",
  "-lc",
  '''
set -euo pipefail
source /workspace/.islo-job/env
cd /workspace/islo-agents
npx tsx src/agent.ts \
  --prompt agents/review/prompt.md \
  --cwd "/workspace/${REPO_SHORT}" \
  --model "{{model}}" \
  --max-turns "{{max_turns}}" \
  --max-budget "{{max_budget_usd}}" \
  --session-key "${REPO}-${PR_NUMBER}" \
  --context-file "/workspace/${REPO_SHORT}/REVIEW.md" \
  --var REPO="${REPO}" \
  --var PR_NUMBER="${PR_NUMBER}"
''',
]

[[run.tasks.steps]]
name = "pause-sandbox"
pause = true
