# islo-loop: push to an islo-loop PR → re-review
[[rules]]

[rules.when]
op = "all"

[[rules.when.conditions]]
op = "exists"
json_path = "$.pull_request"

[[rules.when.conditions]]
op = "equals"
json_path = "$.action"
value = "synchronize"

[[rules.when.conditions]]
op = "contains"
json_path = "$.pull_request.labels[*].name"
value = "islo-loop"

[[rules.when.conditions]]
op = "not"

[rules.when.conditions.condition]
op = "equals"
json_path = "$.pull_request.user.login"
value = "islo-labs[bot]"

[[rules.actions]]
action_type = "trigger_job"
job_name = "review"

[rules.actions.params.repo]
source = { source = "json_path", path = "$.repository.full_name" }

[rules.actions.params.repo_name]
source = { source = "json_path", path = "$.repository.name" }

[rules.actions.params.pr_number]
source = { source = "json_path", path = "$.pull_request.number" }
