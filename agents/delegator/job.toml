[job]
name = "delegator"
version = "0.3.0"
description = "Route human mentions to the right worker sandbox or kick off a new agent job."

[job.params.source]
type = "string"
required = true
description = "Source system that sent the mention event."
pattern = "^(github|linear|slack)$"

[job.params.event_type]
type = "string"
required = true
description = "Source-specific event type, such as issue_comment or review_comment."
pattern = "^[a-zA-Z0-9_.-]+$"

[job.params.raw_payload]
type = "string"
required = true
description = "Raw webhook payload JSON."

[job.params.delivery_id]
type = "string"
default = ""
description = "External delivery ID for idempotency and debugging."

[job.params.agents_git_ref]
type = "string"
default = "main"
description = "Git ref (branch, tag, or commit) of the agents pack to check out."
pattern = "^[a-zA-Z0-9._/@^~-]+$"

[job.params.model]
type = "string"
default = "claude-sonnet-4-5"
description = "Claude model for the delegator agent."

[job.params.max_turns]
type = "integer"
default = 40
description = "Maximum agentic turns."

[job.params.max_budget_usd]
type = "number"
default = 5
description = "Maximum budget in USD."

[run]
fail_fast = true
fanout = false
timeout = 900
workdir = "/workspace"
teardown_on_complete = true

[run.sandbox]
mode = "provision"
image = "docker.io/library/islo-runner:latest"
vcpus = 1
memory_mb = 1024
gateway_profile = "default"
init = { type = "full" }

[[run.tasks]]
name = "delegator"

[[run.tasks.steps]]
name = "write-payload"
timeout = 30
exec = [
  "bash",
  "-lc",
  '''
set -euo pipefail
cat > /workspace/payload.json <<'EOF'
{{raw_payload}}
EOF
''',
]

[[run.tasks.steps]]
name = "checkout-pack"
timeout = 120
exec = [
  "bash",
  "-lc",
  '''
set -euo pipefail
cd /workspace
rm -rf islo-agents
git clone --depth=1 --no-checkout https://github.com/islo-labs/islo-agents.git
cd islo-agents
git fetch --depth=1 origin "{{agents_git_ref}}"
git -c advice.detachedHead=false checkout FETCH_HEAD
''',
]

[[run.tasks.steps]]
name = "install-deps"
timeout = 300
exec = [
  "bash",
  "-lc",
  '''
set -euo pipefail
cd /workspace/islo-agents
npm ci
''',
]

[[run.tasks.steps]]
name = "run-agent"
timeout = 900
exec = [
  "bash",
  "-lc",
  '''
set -euo pipefail
cd /workspace/islo-agents
npx tsx src/agent.ts \
  --prompt agents/delegator/prompt.md \
  --cwd /workspace/islo-agents \
  --model "{{model}}" \
  --max-turns "{{max_turns}}" \
  --max-budget "{{max_budget_usd}}" \
  --context-file /workspace/payload.json \
  --knowledge-id islo-integrations \
  --var SOURCE="{{source}}" \
  --var EVENT_TYPE="{{event_type}}" \
  --var DELIVERY_ID="{{delivery_id}}" \
  --var RAW_PAYLOAD_PATH="/workspace/payload.json"
''',
]
