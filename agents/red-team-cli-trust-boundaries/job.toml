[job]
name = "red-team-cli-trust-boundaries"
version = "0.2.1"
description = "Red-team trust-boundary review of islo-cli (auth, tokens, SSH, update trust)"

[job.params.linear_mode]
type = "string"
required = false
default = "report"
description = "Passed through the line: create Linear issues downstream or report-only"

[outputs.report_json]
type = "string"
required = true
description = "Minified JSON security review report"

[run]
fail_fast = true
fanout = false
timeout = 3600
workdir = "/workspace"

[run.sandbox]
mode = "provision"
image = "docker.io/library/islo-runner:latest"
snapshot_name = "red-team-cli"
vcpus = 2
memory_mb = 4096
disk_gb = 20
gateway_profile = "default"
internet_enabled = true

[run.sandbox.env]
ANTHROPIC_BASE_URL = "https://gateway.islo.dev/inference/anthropic"
ANTHROPIC_DEFAULT_HAIKU_MODEL = "ship-like/claude-sonnet-5"
ANTHROPIC_MODEL = "ship-like/claude-sonnet-5"
ANTHROPIC_SMALL_FAST_MODEL = "ship-like/claude-sonnet-5"
CLAUDE_CODE_DISABLE_EXPERIMENTAL_BETAS = "1"
[[run.tasks]]
name = "review"

[[run.tasks.steps]]
name = "prepare"
exec = ["/opt/red-team-cli/bin/red-team-cli", "prepare-cli"]

[[run.tasks.steps]]
name = "trust-boundaries-review"

[run.tasks.steps.run_agent]
mode = "session"
harness = "claude"
model = "ship-like/claude-sonnet-5"

[run.tasks.steps.run_agent.prompt]
type = "literal"
value = "Read /opt/red-team-cli/prompts/trust-boundaries.md and return its required report_json output."
