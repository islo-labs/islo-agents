[job]
name = "factory-verify"
version = "0.2.0"
description = "Verify an integrated feature across its complete pull-request set."

[job.params.issue_id]
type = "string"
required = true
description = "Linear issue identifier or UUID."

[job.params.pull_requests]
type = "array"
items = "string"
required = true
description = "Complete list of GitHub pull request URLs for the feature."

[outputs.verification_result]
type = "string"
required = true
enum = ["passed", "failed", "blocked"]

[run]
fail_fast = true
fanout = false
timeout = 10800
workdir = "/workspace"
teardown_on_complete = false

[run.sandbox]
mode = "ensure"
name = "factory-verify-{{issue_id}}"
image = "docker.io/library/islo-runner:latest"
snapshot_name = "islo-platform"
vcpus = 8
memory_mb = 16384
gateway_profile = "default"
init = { type = "full" }

[run.sandbox.lifecycle]
pause_after_idle = 1800
delete_after = 172800

[[run.tasks]]
name = "verify"

[[run.tasks.steps]]
name = "run-agent"
timeout = 10800

[run.tasks.steps.run_agent]
mode = "session"
harness = "claude"
model = "claude-opus-4-6"
prompt = { type = "knowledge", slug = "factory-verify-prompt" }
resume_prompt = { type = "literal", value = "The pull requests have been updated after verification failure. Re-fetch PR heads, re-run checks, and verify the integrated feature again." }
knowledge = [
  { type = "knowledge", slug = "islo-integrations" },
  { type = "knowledge", slug = "fullstack-env" },
]
session = "factory-verify-{{issue_id}}"

[[run.tasks.steps]]
name = "pause-sandbox"
pause = true
