[job]
name = "factory-verify"
version = "0.1.0"
description = "Verify an integrated feature across its complete pull-request set."

[job.params.issue_id]
type = "string"
required = true
description = "Linear issue identifier or UUID."

[job.params.pull_requests]
type = "array"
items = "string"
required = true
description = "Complete list of GitHub pull request URLs for the feature."

[outputs.verification_result]
type = "string"
required = true
enum = ["passed", "failed", "blocked"]

[run]
fail_fast = true
fanout = false
timeout = 10800
workdir = "/workspace"
teardown_on_complete = false

[run.sandbox]
mode = "ensure"
name = "factory-verify-{{issue_id}}"
image = "docker.io/library/islo-runner:latest"
snapshot_name = "islo-platform"
vcpus = 8
memory_mb = 16384
gateway_profile = "default"
init = { type = "full" }

[run.sandbox.lifecycle]
pause_after_idle = 1800
delete_after = 604800

[[run.tasks]]
name = "verify"

[[run.tasks.steps]]
name = "run-agent"
timeout = 10800

[run.tasks.steps.run_agent]
mode = "session"
harness = "claude"
model = "claude-opus-4-6"
prompt = """
Verify the integrated feature represented by these pull requests:
{{pull_requests}}

They implement Linear issue {{issue_id}}. Read the issue so you verify the
behavior it asked for, not only that the code builds.

Fetch live GitHub metadata and check out every current PR head. Determine the
affected stack, run each repository's relevant checks, and exercise the
cross-repository behavior end to end where practical.

This sandbox persists across verification rounds for this issue, so earlier
checkouts and build artifacts may already be on disk. Re-fetch every PR head
before you trust anything there, and delete build artifact directories you no
longer need so the disk survives later rounds.

Post your verification report as a comment on every pull request before you
return a verdict:

    gh pr comment <pr-url> --body "<report>"

A failed verdict must include the command you ran and its real output so the
implementer can reproduce it. Do not return failed without posting that
evidence.

Return passed only after every PR and the integrated feature pass. Return
failed when any reproducible code or integration failure needs implementation
work. Return blocked only when verification cannot run because required
infrastructure or credentials are unavailable.
"""

[[run.tasks.steps]]
name = "pause-sandbox"
pause = true
