[job]
name = "red-team-cli-slack-notify"
version = "0.2.0"
description = "Post red-team-cli line completion summary to Slack"

[job.params.slack_channel_id]
type = "string"
required = true
description = "Slack channel ID for chat.postMessage"

[job.params.summary]
type = "string"
required = true
description = "Human-readable run summary from validate-and-report"

[job.params.linear_issue_urls]
type = "string"
required = false
default = "[]"
description = "JSON array string of Linear issue URLs created"

[job.params.line_status]
type = "string"
required = false
default = "succeeded"
description = "Line outcome label for the message header"

[run]
fail_fast = true
fanout = false
timeout = 300
workdir = "/workspace"

[run.sandbox]
mode = "provision"
image = "docker.io/library/islo-runner:latest"
snapshot_name = "red-team-cli"
vcpus = 1
memory_mb = 1024
disk_gb = 5
gateway_profile = "default"
internet_enabled = true

[run.sandbox.env]
SLACK_NOTIFY_CHANNEL_ID = "{{slack_channel_id}}"
SLACK_NOTIFY_SUMMARY = "{{summary}}"
SLACK_NOTIFY_LINEAR_ISSUE_URLS = "{{linear_issue_urls}}"
SLACK_NOTIFY_LINE_STATUS = "{{line_status}}"

[[run.tasks]]
name = "notify"

[[run.tasks.steps]]
name = "post-slack"
exec = ["python3", "/opt/red-team-harness/scripts/post_slack.py"]
