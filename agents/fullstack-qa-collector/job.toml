[job]
name = "fullstack-qa-collector"
version = "0.3.0"
description = "Aggregate QA findings and publish to Linear with deduplication"

[run]
fail_fast = true
fanout = false
concurrency = 1
timeout = 900

[run.sandbox]
mode = "provision"
image = "docker.io/library/islo-runner:latest"
snapshot_name = "qa-collector"
gateway_profile = "default"
environment = "fullstack-qa"
vcpus = 1
memory_mb = 2048
disk_gb = 10
internet_enabled = true

[run.sandbox.env]
DRY_RUN = "1"
LOOKBACK_HOURS = "6"
MAX_ISSUES = "8"

[[run.tasks]]
name = "collect"

[[run.tasks.steps]]
name = "check-snapshot"
exec = ["bash", "-lc", "set -euo pipefail\nif [ ! -f /opt/qa-harness/agent/collect_and_post.py ]; then\n  echo \"ERROR: qa-collector snapshot is missing /opt/qa-harness/agent — see lines/fullstack-qa-line/README.md\" >&2\n  exit 1\nfi\nif [ -z \"${LINEAR_TEAM_ID:-}\" ]; then\n  echo \"ERROR: LINEAR_TEAM_ID must be set in the Factory environment (fullstack-qa)\" >&2\n  exit 1\nfi\n"]

[[run.tasks.steps]]
name = "collect-and-post"
exec = ["bash", "-lc", "set -uo pipefail\npython3 /opt/qa-harness/agent/collect_and_post.py\nrc=$?\necho \"collector exit: $rc\"\nexit $rc\n"]
