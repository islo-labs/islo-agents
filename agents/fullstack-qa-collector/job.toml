[job]
name = "fullstack-qa-collector"
version = "0.5.0"
description = "Aggregate QA findings and publish to Linear with deduplication"

[run]
fail_fast = true
fanout = false
concurrency = 1
timeout = 900

[run.sandbox]
mode = "provision"
image = "docker.io/library/islo-runner:latest"
snapshot_name = "qa-collector"
gateway_profile = "default"
environment = "fullstack-qa"
vcpus = 1
memory_mb = 2048
disk_gb = 10
internet_enabled = true

[run.sandbox.env]
DRY_RUN = "1"
LOOKBACK_HOURS = "6"
MAX_ISSUES = "8"

[[run.tasks]]
name = "collect"

[[run.tasks.steps]]
name = "collect-and-post"
exec = ["python3", "/opt/qa-harness/agent/collect_and_post.py"]
