[job]
name = "fullstack-qa"
version = "0.4.0"
description = "Three parallel QA agents against your local full-stack environment; stages findings to knowledge"

[run]
fail_fast = false
fanout = true
concurrency = 3
timeout = 7200

[run.sandbox]
mode = "provision"
image = "docker.io/library/islo-runner:latest"
snapshot_name = "fullstack-qa"
gateway_profile = "default"
environment = "fullstack-qa"
vcpus = 4
memory_mb = 8192
disk_gb = 30
internet_enabled = true

[run.sandbox.env]
ISLO_BASE_URL = "http://localhost:5173"
QA_RUN_ID = "{{run_id}}"
ANTHROPIC_BASE_URL = "https://gateway.islo.dev/inference/anthropic"
ANTHROPIC_MODEL = "ship-like/claude-sonnet-5"
ANTHROPIC_DEFAULT_HAIKU_MODEL = "ship-like/claude-sonnet-5"
ANTHROPIC_SMALL_FAST_MODEL = "ship-like/claude-sonnet-5"
CLAUDE_CODE_DISABLE_EXPERIMENTAL_BETAS = "1"

[[run.tasks]]
name = "qa-agent-web-core"

[[run.tasks.steps]]
name = "check-snapshot"
exec = ["bash", "-lc", "test -f /opt/qa-harness/agent/cleanup.py && test -f /workspace/qa-harness/package.json"]

[[run.tasks.steps]]
name = "start-stack"
exec = ["bash", "/opt/qa-harness/scripts/start-qa-stack.sh"]

[[run.tasks.steps]]
name = "explore"
workdir = "/workspace/qa-harness"

[run.tasks.steps.run_agent]
mode = "session"
harness = "claude"
model = "ship-like/claude-sonnet-5"

[run.tasks.steps.run_agent.prompt]
type = "literal"
value = "Read and follow `/opt/qa-harness/prompts/full/agent-web-core.md` exactly. Write `/workspace/findings.json` per that contract."

[[run.tasks.steps]]
name = "cleanup"
exec = ["bash", "-lc", "QA_AGENT_ID=qa-agent-web-core python3 /opt/qa-harness/agent/cleanup.py || true"]

[[run.tasks.steps]]
name = "stage-findings"
exec = ["bash", "-lc", "QA_AGENT_ID=qa-agent-web-core QA_BRIEF_LABEL='Web core: login, navigation, sandbox lifecycle, terminal/share' python3 /opt/qa-harness/agent/stage_findings.py || true"]

[[run.tasks]]
name = "qa-agent-web-platform"

[[run.tasks.steps]]
name = "check-snapshot"
exec = ["bash", "-lc", "test -f /opt/qa-harness/agent/cleanup.py && test -f /workspace/qa-harness/package.json"]

[[run.tasks.steps]]
name = "start-stack"
exec = ["bash", "/opt/qa-harness/scripts/start-qa-stack.sh"]

[[run.tasks.steps]]
name = "explore"
workdir = "/workspace/qa-harness"

[run.tasks.steps.run_agent]
mode = "session"
harness = "claude"
model = "ship-like/claude-sonnet-5"

[run.tasks.steps.run_agent.prompt]
type = "literal"
value = "Read and follow `/opt/qa-harness/prompts/full/agent-web-platform.md` exactly. Write `/workspace/findings.json` per that contract."

[[run.tasks.steps]]
name = "cleanup"
exec = ["bash", "-lc", "QA_AGENT_ID=qa-agent-web-platform python3 /opt/qa-harness/agent/cleanup.py || true"]

[[run.tasks.steps]]
name = "stage-findings"
exec = ["bash", "-lc", "QA_AGENT_ID=qa-agent-web-platform QA_BRIEF_LABEL='Web platform: settings, deep links, Factory, environments, integrations' python3 /opt/qa-harness/agent/stage_findings.py || true"]

[[run.tasks]]
name = "qa-agent-cli-cross"

