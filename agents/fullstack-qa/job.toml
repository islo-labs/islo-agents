exec = ["bash", "-lc", "QA_AGENT_ID=qa-agent-cli-cross QA_BRIEF_LABEL='CLI and cross-surface: doctor, status, sandbox ops, web consistency' python3 /opt/qa-harness/agent/stage_findings.py || true"]
