exec = ["bash", "-lc", "test -f /opt/qa-harness/agent/cleanup.py && test -f /workspace/qa-harness/package.json"]

[[run.tasks.steps]]
name = "start-stack"
exec = ["bash", "/opt/qa-harness/scripts/start-qa-stack.sh"]

[[run.tasks.steps]]
name = "explore"
workdir = "/workspace/qa-harness"

[run.tasks.steps.run_agent]
mode = "session"
harness = "claude"
model = "ship-like/claude-sonnet-5"

[run.tasks.steps.run_agent.prompt]
type = "literal"
value = "Read and follow `/opt/qa-harness/prompts/full/agent-cli-cross.md` exactly. Write `/workspace/findings.json` per that contract."

[[run.tasks.steps]]
name = "cleanup"
exec = ["bash", "-lc", "QA_AGENT_ID=qa-agent-cli-cross python3 /opt/qa-harness/agent/cleanup.py || true"]

