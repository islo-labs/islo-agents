[[rules]]

[rules.when]
op = "all"

[[rules.when.conditions]]
op = "equals"
json_path = "$.action"
value = "update"

[[rules.when.conditions]]
op = "exists"
json_path = "$.updatedFrom.labelIds"

[[rules.when.conditions]]
op = "contains"
json_path = "$.data.labelIds"
value = "REPLACE_WITH_YOUR_LINEAR_LABEL_ID"

[[rules.when.conditions]]
op = "not"

[rules.when.conditions.condition]
op = "contains"
json_path = "$.updatedFrom.labelIds"
value = "REPLACE_WITH_YOUR_LINEAR_LABEL_ID"

[[rules.actions]]
action_type = "trigger_job"
job_name = "implementer"

[rules.actions.params.issue_id]
source = { source = "json_path", path = "$.data.id" }

[rules.actions.params.issue_title]
source = { source = "json_path", path = "$.data.title" }

[rules.actions.params.issue_description]
source = { source = "json_path", path = "$.data.description" }

[rules.actions.params.issue_identifier]
source = { source = "json_path", path = "$.data.identifier" }

[rules.actions.params.issue_url]
source = { source = "json_path", path = "$.url" }
