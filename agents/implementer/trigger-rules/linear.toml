[[rules.when.conditions]]
op = "exists"
json_path = "$.updatedFrom.labelIds"

[[rules.when.conditions]]
op = "contains"
json_path = "$.data.labelIds"
value = "5e83752c-0783-4f1e-adbe-3b17e007518a"

