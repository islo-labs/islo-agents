[job]
name = "implementer"
version = "0.7.0"
description = "Implement a tracked issue: enrich context from the source system, change code, open PR(s), report back."

[job.params.issue_id]
type = "string"
required = true
description = "Stable issue ID in the source system (UUID, key, etc.)."

[job.params.issue_title]
type = "string"
default = ""
description = "Issue title."

[job.params.issue_description]
type = "string"
default = ""
description = "Issue description/body."

[job.params.issue_identifier]
type = "string"
default = ""
description = "Human-readable issue identifier (e.g. ENG-123, PROJ-45)."

[job.params.issue_url]
type = "string"
default = ""
description = "URL of the issue in the source system."

[job.params.agents_git_ref]
type = "string"
default = "main"
description = "Git ref (branch, tag, or commit) of the agents pack to check out."
pattern = "^[a-zA-Z0-9._/@^~-]+$"

[job.params.harness]
type = "string"
default = "claude"
description = "Agent harness: claude or codex."
pattern = "^(claude|codex)$"

[job.params.model]
type = "string"
default = "claude-opus-4-6"
description = "Model name understood by the selected harness."

[job.params.max_turns]
type = "integer"
default = 100
description = "Maximum agentic turns (Claude only; ignored by Codex)."

[job.params.max_budget_usd]
type = "number"
default = 15
description = "Maximum budget in USD."

[job.params.reasoning_effort]
type = "string"
default = "high"
description = "Reasoning effort level for both harnesses. Codex uses minimal–xhigh; Claude uses low–max."
pattern = "^(minimal|low|medium|high|xhigh|max)$"

[job.params.max_iterations]
type = "integer"
default = 5
description = "Maximum implementation loop iterations before hard-stopping."

[run]
fail_fast = true
fanout = false
timeout = 3600
workdir = "/workspace"
teardown_on_complete = false

[run.sandbox]
mode = "ensure"
name = "implementer-{{issue_identifier}}"
image = "docker.io/library/islo-runner:latest"
snapshot_name = "islo-stack"
vcpus = 4
memory_mb = 4096
gateway_profile = "default"
init = { type = "full" }

[run.sandbox.lifecycle]
pause_after_idle = 1800
delete_after = 604800

[[run.tasks]]
name = "implementer"

[[run.tasks.steps]]
name = "checkout-pack"
timeout = 120
exec = [
  "bash",
  "-lc",
  '''
set -euo pipefail
cd /workspace
rm -rf .islo-pack
git clone --depth=1 --no-checkout https://github.com/islo-labs/islo-agents.git .islo-pack
cd .islo-pack
git fetch --depth=1 origin "{{agents_git_ref}}"
git -c advice.detachedHead=false checkout FETCH_HEAD
''',
]

[[run.tasks.steps]]
name = "install-deps"
timeout = 300
exec = [
  "bash",
  "-lc",
  '''
set -euo pipefail
cd /workspace/.islo-pack
npm ci
''',
]

[[run.tasks.steps]]
name = "iteration-guard"
timeout = 10
exec = [
  "bash",
  "-lc",
  '''
set -euo pipefail
COUNTER="/workspace/.islo-agents/iteration-count"
mkdir -p "$(dirname "$COUNTER")"
COUNT=0
[ -f "$COUNTER" ] && COUNT=$(cat "$COUNTER")
COUNT=$((COUNT + 1))
echo "$COUNT" > "$COUNTER"
if [ "$COUNT" -gt {{max_iterations}} ]; then
  echo "iteration-guard: limit reached ($COUNT/{{max_iterations}}). Stopping."
  exit 1
fi
echo "iteration-guard: run $COUNT/{{max_iterations}}"
''',
]

[[run.tasks.steps]]
name = "run-agent"
timeout = 3600
exec = [
  "bash",
  "-lc",
  '''
set -euo pipefail
# Write issue params to files via quoted heredocs so markdown backticks/quotes
# in the Linear body cannot be interpreted as shell (command substitution).
mkdir -p /workspace/.islo-job
cat > /workspace/.islo-job/issue_id <<'ISLO_EOF'
{{issue_id}}
ISLO_EOF
cat > /workspace/.islo-job/issue_title <<'ISLO_EOF'
{{issue_title}}
ISLO_EOF
cat > /workspace/.islo-job/issue_description <<'ISLO_EOF'
{{issue_description}}
ISLO_EOF
cat > /workspace/.islo-job/issue_identifier <<'ISLO_EOF'
{{issue_identifier}}
ISLO_EOF
cat > /workspace/.islo-job/issue_url <<'ISLO_EOF'
{{issue_url}}
ISLO_EOF
cd /workspace/.islo-pack
SESSION_KEY="implementer-$(tr -d '\n' < /workspace/.islo-job/issue_identifier)"
SESSION_FILE="/workspace/.islo-agents/sessions/$(printf '%s' "${SESSION_KEY}" | tr -c 'a-zA-Z0-9_.-' '-').session.json"
if [ -f "$SESSION_FILE" ]; then
  npx tsx src/agent.ts --resume --session-key "${SESSION_KEY}" \
    --cwd /workspace --max-budget "{{max_budget_usd}}" \
    --reasoning-effort "{{reasoning_effort}}" \
    "Continue your implementation."
else
  HARNESS="{{harness}}"
  HARNESS_ARGS=(--reasoning-effort "{{reasoning_effort}}")
  case "${HARNESS}" in
    claude)
      HARNESS_ARGS+=(--max-turns "{{max_turns}}")
      ;;
    codex)
      ;;
    *)
      echo "Unsupported harness: ${HARNESS}" >&2
      exit 2
      ;;
  esac
  npx tsx src/agent.ts \
    --prompt agents/implementer/prompt.md \
    --harness "${HARNESS}" \
    --cwd /workspace \
    --session-key "${SESSION_KEY}" \
    --model "{{model}}" \
    --max-budget "{{max_budget_usd}}" \
    "${HARNESS_ARGS[@]}" \
    --knowledge-id islo-integrations \
    --var ISSUE_ID="$(tr -d '\n' < /workspace/.islo-job/issue_id)" \
    --var ISSUE_TITLE="$(cat /workspace/.islo-job/issue_title)" \
    --var ISSUE_DESCRIPTION="$(cat /workspace/.islo-job/issue_description)" \
    --var ISSUE_IDENTIFIER="$(tr -d '\n' < /workspace/.islo-job/issue_identifier)" \
    --var ISSUE_URL="$(tr -d '\n' < /workspace/.islo-job/issue_url)"
fi
''',
]

[[run.tasks.steps]]
name = "pause-sandbox"
pause = true
