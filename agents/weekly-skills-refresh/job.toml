[job]
name = "weekly-skills-refresh"
version = "0.2.0"
description = "Weekly stack change review and refresh of your agent skills repository"

[job.params.branch_prefix]
type = "string"
default = "factory/weekly-skills-refresh"
description = "Branch name prefix for PRs"

[job.params.publish_mode]
type = "string"
default = "pr"
description = "How to publish updates: pr, commit, or report"

[job.params.since]
type = "string"
default = "7 days ago"
description = "Human-readable lookback window for stack changes"

[job.params.skills_repo]
type = "string"
default = "your-org/agent-skills"
description = "Target skills repo to refresh (owner/name)"

[outputs.summary]
type = "string"
required = true
description = "Short human-readable summary of the refresh"

[run]
fail_fast = true
fanout = false
concurrency = 1
timeout = 1800

[run.sandbox]
mode = "provision"
image = "docker.io/library/islo-runner:latest"
snapshot_name = "islo-stack"
gateway_profile = "default"
vcpus = 2
memory_mb = 4096
disk_gb = 20
internet_enabled = true

[run.sandbox.env]
SKILLS_REPO = "{{skills_repo}}"
SINCE = "{{since}}"
PUBLISH_MODE = "{{publish_mode}}"
BRANCH_PREFIX = "{{branch_prefix}}"
GIT_COMMITTER_NAME = "Factory Agent"
GIT_COMMITTER_EMAIL = "factory-agent@users.noreply.github.com"
ANTHROPIC_BASE_URL = "https://gateway.islo.dev/inference/anthropic"
ANTHROPIC_DEFAULT_HAIKU_MODEL = "ship-like/claude-sonnet-5"
ANTHROPIC_MODEL = "ship-like/claude-sonnet-5"
ANTHROPIC_SMALL_FAST_MODEL = "ship-like/claude-sonnet-5"
CLAUDE_CODE_DISABLE_EXPERIMENTAL_BETAS = "1"

[[run.tasks]]
name = "refresh"

[[run.tasks.steps]]
name = "checkout-skills"
exec = [
  "bash",
  "-lc",
  '''set -euo pipefail
mkdir -p /workspace
cd /workspace
if [ ! -d skills/.git ]; then
  rm -rf skills
  gh repo clone "$SKILLS_REPO" skills
else
  cd skills
  git checkout main || git checkout master
  git pull --ff-only
fi
''',
]

[[run.tasks.steps]]
name = "collect-changes"
exec = [
  "bash",
  "-lc",
  '''set -euo pipefail
cd /workspace
export SINCE_ISO=$(date -u -d "$SINCE" +%Y-%m-%dT%H:%M:%SZ)
echo "Collecting local stack changes since $SINCE_ISO"
python3 - <<'PY'
import json, os, subprocess
from pathlib import Path

since = os.environ["SINCE_ISO"]
repos = []
seen = set()

def add_repo(root: Path) -> None:
    if root.name == "skills" or str(root) in seen:
        return
    seen.add(str(root))
    name = root.name
    try:
        subprocess.run(["git", "-C", str(root), "fetch", "--quiet", "origin"], check=False)
        remote = subprocess.check_output(
            ["git", "-C", str(root), "remote", "show", "origin"],
            text=True,
            stderr=subprocess.DEVNULL,
        )
        head = "main"
        for line in remote.splitlines():
            if "HEAD branch:" in line:
                head = line.split()[-1]
                break
        ref = f"origin/{head}"
        if subprocess.run(["git", "-C", str(root), "rev-parse", "--verify", ref], capture_output=True).returncode != 0:
            ref = head
        log = subprocess.check_output(
            ["git", "-C", str(root), "log", f"--since={since}", ref, "--pretty=format:%h\t%s\t%an\t%aI", "-n", "100"],
            text=True,
            stderr=subprocess.DEVNULL,
        ).strip()
        if not log:
            return
        commits = []
        for line in log.splitlines():
            parts = line.split("\t", 3)
            if len(parts) != 4:
                continue
            sha, msg, author, date = parts
            commits.append({"sha": sha, "message": msg, "author": author, "date": date})
        files = subprocess.check_output(
            ["git", "-C", str(root), "log", f"--since={since}", ref, "--name-only", "--pretty=format:"],
            text=True,
            stderr=subprocess.DEVNULL,
        )
        touched = sorted({f.strip() for f in files.splitlines() if f.strip()})[:200]
        repos.append({"repo": name, "path": str(root), "commits": commits, "files": touched})
    except Exception:
        return

for pattern in ("*/.git", "*/*/.git"):
    for gitdir in sorted(Path("/workspace").glob(pattern)):
        if gitdir.is_dir():
            add_repo(gitdir.parent)

Path("/workspace/changes.json").write_text(json.dumps({"since": since, "repos": repos}, indent=2) + "\n")
print(f"Collected {len(repos)} repos into /workspace/changes.json")
PY
''',
]

[[run.tasks.steps]]
name = "analyze-and-update"

[run.tasks.steps.run_agent]
mode = "session"
harness = "claude"
model = "ship-like/claude-sonnet-5"

[run.tasks.steps.run_agent.prompt]
type = "literal"
value = """
You are running inside the Islo Factory job `weekly-skills-refresh`.

## Purpose of this repo

`your agent skills repository` teaches coding agents **how to work with your product correctly**. It is not a changelog, release notes feed, or mirror of stack development activity.

Only update skill docs when a stack change would cause an agent to **work differently** than the current skill text says — wrong commands, missing workflows, outdated manifest fields, deprecated patterns, or absent guidance for a capability agents now need.

## Context

- Target repo: `/workspace/skills`
- Stack activity: `/workspace/changes.json` (commits/files from islo-stack repos over the lookback window)
- Parameters: skills_repo=$SKILLS_REPO, since=$SINCE, publish_mode=$PUBLISH_MODE, branch_prefix=$BRANCH_PREFIX

## Decision rules

**Edit only if ALL are true:**
1. A concrete stack change (commit/diff) affects agent-facing behavior: CLI, manifests, APIs, gateway/auth, sandbox lifecycle, Factory lines, jobs, webhooks, SDK, or skill routing.
2. The current skill text would mislead an agent or omit a workflow they need.
3. The fix is durable guidance (how/when to do something), not a note about what shipped recently.

**Do NOT edit for:**
- Release notes, timelines, observability, or "now you can see X" UX improvements
- Internal refactors, tests, CI, performance, or repo hygiene with no agent impact
- Restating commands or docs that are already correct in the skill
- Speculative updates from commit titles without verifying agent impact
- Duplicating Islo product docs — skills stay concise and action-oriented

**Allowed paths:** `plugins/islo/**`, `README.md`, plugin metadata only.

**Default when uncertain:** make **no** file edits.

## Workflow

1. Read `/workspace/changes.json` and identify commits that plausibly affect agent workflows.
2. For each candidate, read the relevant skill files and verify the gap is real.
3. Make minimal, surgical edits — update wrong guidance, add missing workflow steps, mark deprecations. Do not append changelog paragraphs.
4. Do NOT run git commit, push, or open a PR.
5. Return JSON:
   {
     "summary": "what you did or why no edits were needed",
     "files_changed": ["relative/path/to/file1"]
   }

If no agent-actionable skill gap exists, return `files_changed: []` and explain why in `summary`.
"""

[[run.tasks.steps]]
name = "publish"
exec = [
  "bash",
  "-lc",
  '''set -euo pipefail
cd /workspace/skills

gh auth setup-git
git config user.email "$GIT_COMMITTER_EMAIL"
git config user.name "$GIT_COMMITTER_NAME"

if git diff --cached --quiet && git diff --quiet; then
  echo "No changes to publish"
  echo "NO_CHANGES" > /workspace/publish-result.txt
  exit 0
fi

BRANCH="${BRANCH_PREFIX}/$(date -u +%Y-%m-%d-%H%M%S)"
git checkout -b "$BRANCH"
git add plugins/ README.md 2>/dev/null || git add -A
git commit -m "chore: weekly skills refresh from stack changes"

if [ "$PUBLISH_MODE" = "commit" ]; then
  git push origin HEAD:main
  URL="https://github.com/$SKILLS_REPO/commit/$(git rev-parse HEAD)"
elif [ "$PUBLISH_MODE" = "pr" ]; then
  git push origin "$BRANCH"
  URL=$(gh pr create --repo "$SKILLS_REPO" --title "Weekly skills refresh $(date -u +%Y-%m-%d)" --body "Automated refresh from stack changes over $SINCE." --head "$BRANCH")
else
  URL="report-only"
fi

echo "$URL" > /workspace/publish-result.txt
''',
]

[[run.tasks.steps]]
name = "report"
exec = [
  "bash",
  "-lc",
  '''set -euo pipefail
cat /workspace/publish-result.txt
''',
]
