[job]
name = "weekly-skills-refresh"
version = "0.6.0"
description = "Review recent product repo changes and refresh your agent skills repository when guidance is stale"

[job.params.branch_prefix]
type = "string"
default = "factory/skills-refresh"
description = "Branch name prefix for PRs"

[job.params.publish_mode]
type = "string"
default = "pr"
description = "How to publish updates: pr, commit, or report"

[job.params.since]
type = "string"
default = "7 days ago"
description = "Human-readable lookback window for product repo changes"

[job.params.skills_repo]
type = "string"
default = "your-org/agent-skills"
description = "Target skills repo to refresh (owner/name)"

[job.params.skills_globs]
type = "string"
default = "**"
description = "Space-separated globs (relative to skills repo root) the agent may edit"

[job.params.commit_message]
type = "string"
default = "chore: refresh agent skills from product changes"
description = "Git commit message when publishing changes"

[outputs.summary]
type = "string"
required = true
description = "Short human-readable summary of the refresh"

[run]
fail_fast = true
fanout = false
concurrency = 1
timeout = 1800

[run.sandbox]
mode = "provision"
image = "docker.io/library/islo-runner:latest"
snapshot_name = "skills-refresh"
gateway_profile = "default"
vcpus = 2
memory_mb = 4096
disk_gb = 20
internet_enabled = true

[run.sandbox.env]
SKILLS_REPO = "{{skills_repo}}"
SINCE = "{{since}}"
PUBLISH_MODE = "{{publish_mode}}"
BRANCH_PREFIX = "{{branch_prefix}}"
SKILLS_GLOBS = "{{skills_globs}}"
COMMIT_MESSAGE = "{{commit_message}}"
GIT_COMMITTER_NAME = "Factory Agent"
GIT_COMMITTER_EMAIL = "factory-agent@users.noreply.github.com"
ANTHROPIC_BASE_URL = "https://gateway.islo.dev/inference/anthropic"
ANTHROPIC_DEFAULT_HAIKU_MODEL = "ship-like/claude-sonnet-5"
ANTHROPIC_MODEL = "ship-like/claude-sonnet-5"
ANTHROPIC_SMALL_FAST_MODEL = "ship-like/claude-sonnet-5"
CLAUDE_CODE_DISABLE_EXPERIMENTAL_BETAS = "1"

[[run.tasks]]
name = "refresh"

[[run.tasks.steps]]
name = "refresh"

[run.tasks.steps.run_agent]
mode = "session"
harness = "claude"
model = "ship-like/claude-sonnet-5"

[run.tasks.steps.run_agent.prompt]
type = "literal"
value = "You are running a scheduled **agent skills refresh** Factory job.\n\n## Purpose\n\n`/workspace/skills` teaches coding agents **how to work with your product correctly**. It is not a changelog or release-notes feed.\n\nOnly update skill docs when a product change would cause an agent to **work differently** than the current skill text says.\n\n## Parameters (sandbox env)\n\n| Variable | Meaning |\n|----------|---------|\n| `SKILLS_REPO` | GitHub `owner/repo` to clone and update |\n| `SINCE` | Lookback window for product commits (e.g. `7 days ago`) |\n| `PUBLISH_MODE` | `pr`, `commit`, or `report` |\n| `BRANCH_PREFIX` | Branch prefix when opening a PR |\n| `SKILLS_GLOBS` | Space-separated globs you may edit under the skills repo |\n| `COMMIT_MESSAGE` | Git commit message when publishing |\n| `GIT_COMMITTER_NAME` / `GIT_COMMITTER_EMAIL` | Git author |\n\nProduct repos are already checked out under `/workspace/` (each with a `.git` directory). Do not treat `/workspace/skills` as a baked product repo.\n\n## Workflow\n\n1. **Checkout skills repo** at `/workspace/skills`:\n   - If missing: `gh repo clone $SKILLS_REPO /workspace/skills`\n   - Else: `git fetch`, checkout `main` or `master`, `git pull --ff-only`\n   - Run `gh auth setup-git` if needed; set `git config user.name` / `user.email` from env\n\n2. **Collect product changes** since `SINCE`:\n   - Walk git repos under `/workspace/` (skip `/workspace/skills`)\n   - For each repo: `git log --since=\"$SINCE\" …` and touched file lists\n   - Keep notes locally; you do not need to write a separate JSON file\n\n3. **Decide what to edit** (see rules below). Make minimal edits only under paths matching `SKILLS_GLOBS`.\n\n4. **Publish** when you changed files:\n   - If no edits: skip git publish\n   - `report`: do not commit or push; note that in output\n   - `commit`: commit on current branch, `git push origin HEAD:main` (or default branch)\n   - `pr`: create branch `$BRANCH_PREFIX/<timestamp>`, commit, push, `gh pr create`\n   - If nothing to commit after edits, skip publish\n\n5. **Return JSON** (required structured output):\n   ```json\n   {\n     \"summary\": \"what you did or why no edits were needed\",\n     \"files_changed\": [\"relative/path/under/skills/repo\"],\n     \"publish_url\": \"PR or commit URL, or empty string\"\n   }\n   ```\n\n## Decision rules\n\n**Edit only if ALL are true:**\n1. A concrete product change affects agent-facing behavior (CLI, API, SDK, config, auth, deployment, integrations).\n2. Current skill text would mislead an agent or omit a workflow they need.\n3. The fix is durable guidance, not a changelog entry.\n\n**Do NOT edit for:** release notes, internal refactors, tests/CI-only changes, cosmetic UX, restating already-correct docs, speculative updates from commit titles alone.\n\n**Default when uncertain:** make **no** file edits.\n"
