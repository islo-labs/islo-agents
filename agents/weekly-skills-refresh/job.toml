[job]
name = "weekly-skills-refresh"
version = "0.3.1"
description = "Weekly stack change review and refresh of your agent skills repository"

[job.params.branch_prefix]
type = "string"
default = "factory/weekly-skills-refresh"
description = "Branch name prefix for PRs"

[job.params.publish_mode]
type = "string"
default = "pr"
description = "How to publish updates: pr, commit, or report"

[job.params.since]
type = "string"
default = "7 days ago"
description = "Human-readable lookback window for stack changes"

[job.params.skills_repo]
type = "string"
default = "your-org/agent-skills"
description = "Target skills repo to refresh (owner/name)"

[outputs.summary]
type = "string"
required = true
description = "Short human-readable summary of the refresh"

[run]
fail_fast = true
fanout = false
concurrency = 1
timeout = 1800

[run.sandbox]
mode = "provision"
image = "docker.io/library/islo-runner:latest"
snapshot_name = "skills-refresh"
gateway_profile = "default"
vcpus = 2
memory_mb = 4096
disk_gb = 20
internet_enabled = true

[run.sandbox.env]
SKILLS_REPO = "{{skills_repo}}"
SINCE = "{{since}}"
PUBLISH_MODE = "{{publish_mode}}"
BRANCH_PREFIX = "{{branch_prefix}}"
GIT_COMMITTER_NAME = "Factory Agent"
GIT_COMMITTER_EMAIL = "factory-agent@users.noreply.github.com"
ANTHROPIC_BASE_URL = "https://gateway.islo.dev/inference/anthropic"
ANTHROPIC_DEFAULT_HAIKU_MODEL = "ship-like/claude-sonnet-5"
ANTHROPIC_MODEL = "ship-like/claude-sonnet-5"
ANTHROPIC_SMALL_FAST_MODEL = "ship-like/claude-sonnet-5"
CLAUDE_CODE_DISABLE_EXPERIMENTAL_BETAS = "1"
PYTHONPATH = "/opt/skills-refresh-harness"

[[run.tasks]]
name = "refresh"

[[run.tasks.steps]]
name = "checkout-skills"
exec = ["python3", "-m", "harness", "checkout"]

[[run.tasks.steps]]
name = "collect-changes"
exec = ["python3", "-m", "harness", "collect"]

[[run.tasks.steps]]
name = "analyze-and-update"

[run.tasks.steps.run_agent]
mode = "session"
harness = "claude"
model = "ship-like/claude-sonnet-5"

[run.tasks.steps.run_agent.prompt]
type = "literal"
value = "Read `/opt/skills-refresh-harness/prompts/analyze-and-update.md` and follow it exactly."

[[run.tasks.steps]]
name = "publish"
exec = ["python3", "-m", "harness", "publish"]

[[run.tasks.steps]]
name = "report"
exec = ["cat", "/workspace/publish-result.txt"]
