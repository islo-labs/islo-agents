[job]
name = "weekly-skills-refresh"
version = "0.4.0"
description = "Review recent product repo changes and refresh your agent skills repository when guidance is stale"

[job.params.branch_prefix]
type = "string"
default = "factory/skills-refresh"
description = "Branch name prefix for PRs"

[job.params.publish_mode]
type = "string"
default = "pr"
description = "How to publish updates: pr, commit, or report"

[job.params.since]
type = "string"
default = "7 days ago"
description = "Human-readable lookback window for product repo changes"

[job.params.skills_repo]
type = "string"
default = "your-org/agent-skills"
description = "Target skills repo to refresh (owner/name)"

[job.params.skills_globs]
type = "string"
default = "**"
description = "Space-separated globs (relative to skills repo root) the agent may edit"

[job.params.commit_message]
type = "string"
default = "chore: refresh agent skills from product changes"
description = "Git commit message when publishing changes"

[outputs.summary]
type = "string"
required = true
description = "Short human-readable summary of the refresh"

[run]
fail_fast = true
fanout = false
concurrency = 1
timeout = 1800

[run.sandbox]
mode = "provision"
image = "docker.io/library/islo-runner:latest"
snapshot_name = "weekly-skills-refresh"
gateway_profile = "default"
vcpus = 2
memory_mb = 4096
disk_gb = 20
internet_enabled = true

[run.sandbox.env]
SKILLS_REPO = "{{skills_repo}}"
SINCE = "{{since}}"
PUBLISH_MODE = "{{publish_mode}}"
BRANCH_PREFIX = "{{branch_prefix}}"
SKILLS_GLOBS = "{{skills_globs}}"
COMMIT_MESSAGE = "{{commit_message}}"
GIT_COMMITTER_NAME = "Factory Agent"
GIT_COMMITTER_EMAIL = "factory-agent@users.noreply.github.com"
ANTHROPIC_BASE_URL = "https://gateway.islo.dev/inference/anthropic"
ANTHROPIC_DEFAULT_HAIKU_MODEL = "ship-like/claude-sonnet-5"
ANTHROPIC_MODEL = "ship-like/claude-sonnet-5"
ANTHROPIC_SMALL_FAST_MODEL = "ship-like/claude-sonnet-5"
CLAUDE_CODE_DISABLE_EXPERIMENTAL_BETAS = "1"
[[run.tasks]]
name = "refresh"

[[run.tasks.steps]]
name = "checkout-skills"
exec = ["/opt/weekly-skills-refresh/bin/weekly-skills-refresh", "checkout"]

[[run.tasks.steps]]
name = "collect-changes"
exec = ["/opt/weekly-skills-refresh/bin/weekly-skills-refresh", "collect"]

[[run.tasks.steps]]
name = "analyze-and-update"

[run.tasks.steps.run_agent]
mode = "session"
harness = "claude"
model = "ship-like/claude-sonnet-5"

[run.tasks.steps.run_agent.prompt]
type = "literal"
value = "Read /opt/weekly-skills-refresh/prompts/analyze-and-update.md and return the required JSON."

[[run.tasks.steps]]
name = "publish"
exec = ["/opt/weekly-skills-refresh/bin/weekly-skills-refresh", "publish"]

[[run.tasks.steps]]
name = "report"
exec = ["cat", "/workspace/publish-result.txt"]
