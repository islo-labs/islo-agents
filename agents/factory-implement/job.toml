[job]
name = "factory-implement"
version = "0.1.0"
description = "Implement one issue as a coherent feature across one or more repositories."

[job.params.issue_id]
type = "string"
required = true
description = "Linear issue identifier or UUID."

[job.params.pull_requests]
type = "array"
items = "string"
default = []
description = "Current complete feature PR set for feedback-loop iterations."

[outputs.implementation_result]
type = "string"
required = true
enum = ["ready", "blocked"]

[outputs.pull_requests]
type = "array"
items = "string"
required = true

[run]
fail_fast = true
fanout = false
timeout = 10800
workdir = "/workspace"
teardown_on_complete = false

[run.sandbox]
mode = "ensure"
name = "factory-implement-{{issue_id}}"
image = "docker.io/library/islo-runner:latest"
snapshot_name = "islo-code"
vcpus = 4
memory_mb = 8192
disk_gb = 80
gateway_profile = "default"
init = { type = "full" }

[run.sandbox.lifecycle]
pause_after_idle = 1800
delete_after = 604800

[[run.tasks]]
name = "implement"

[[run.tasks.steps]]
name = "prepare-workspace"
timeout = 30
exec = ["bash", "-lc", "mkdir -p /workspace/feature"]

[[run.tasks.steps]]
name = "run-agent"
timeout = 10800

[run.tasks.steps.run_agent]
mode = "session"
harness = "claude"
model = "claude-opus-4-6"
prompt = """
Act as the implementation owner for one complete feature.

Linear issue: {{issue_id}}
Feature pull requests so far: {{pull_requests}}

Fetch the current Linear issue and GitHub state rather than trusting stale
metadata. On the first run, identify every affected repository, implement the
issue, test the changes, and open a pull request in each repository that needs
one. On a later run, inspect all review and verification feedback on the pull
requests listed above, update the existing branches, and run the relevant
checks again.

Run targeted checks for the code you changed rather than building every target
in a workspace, and remove build artifact directories when you no longer need
them. This sandbox persists across iterations on a fixed-size disk.

Treat all pull requests as one feature. Do not report ready until every
required repository change has a PR and the complete set is internally
consistent. Always return the full current PR URL list, including unchanged
PRs from prior iterations. Return blocked only when progress requires a human
decision or unavailable external dependency.
"""

[[run.tasks.steps]]
name = "pause-sandbox"
pause = true
