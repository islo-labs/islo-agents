[job]
name = "factory-implement"
version = "0.2.0"
description = "Implement one issue as a coherent feature across one or more repositories."

[job.params.issue_id]
type = "string"
required = true
description = "Linear issue identifier or UUID."

[job.params.pull_requests]
type = "array"
items = "string"
default = []
description = "Current complete feature PR set for feedback-loop iterations."

[outputs.implementation_result]
type = "string"
required = true
enum = ["ready", "blocked"]

[outputs.pull_requests]
type = "array"
items = "string"
required = true

[run]
fail_fast = true
fanout = false
timeout = 10800
workdir = "/workspace"
teardown_on_complete = false

[run.sandbox]
mode = "ensure"
name = "factory-implement-{{issue_id}}"
image = "docker.io/library/islo-runner:latest"
snapshot_name = "islo-code"
vcpus = 4
memory_mb = 8192
gateway_profile = "default"
init = { type = "full" }

[run.sandbox.lifecycle]
pause_after_idle = 1800
delete_after = 604800

[[run.tasks]]
name = "implement"

[[run.tasks.steps]]
name = "run-agent"
timeout = 10800

[run.tasks.steps.run_agent]
mode = "session"
harness = "claude"
model = "claude-opus-4-6"
prompt_ref = "factory-implement-prompt"
resume_prompt = "Feedback arrived on the pull requests. Address all review and verification comments, update the branches, and re-run checks."
knowledge = ["islo-integrations"]
session = "factory-impl-{{issue_id}}"

[[run.tasks.steps]]
name = "pause-sandbox"
pause = true
