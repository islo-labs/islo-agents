[job]
name = "factory-review"
version = "0.1.0"
description = "Review every pull request in a feature as one aggregate change."

[job.params.issue_id]
type = "string"
required = true
description = "Linear issue identifier or UUID."

[job.params.pull_requests]
type = "array"
items = "string"
required = true
description = "Complete list of GitHub pull request URLs for the feature."

[outputs.review_result]
type = "string"
required = true
enum = ["approved", "needs_changes", "blocked"]

[run]
fail_fast = true
fanout = false
timeout = 7200
workdir = "/workspace"
teardown_on_complete = false

[run.sandbox]
mode = "ensure"
name = "factory-review-{{issue_id}}"
image = "docker.io/library/islo-runner:latest"
snapshot_name = "islo-code"
vcpus = 4
memory_mb = 8192
gateway_profile = "default"
init = { type = "full" }

[run.sandbox.lifecycle]
pause_after_idle = 1800
delete_after = 604800

[[run.tasks]]
name = "review"

[[run.tasks.steps]]
name = "run-agent"
timeout = 7200

[run.tasks.steps.run_agent]
mode = "session"
harness = "claude"
model = "claude-opus-4-6"
prompt = """
Review these pull requests as one coherent feature:
{{pull_requests}}

They implement Linear issue {{issue_id}}. Read the issue so you can judge
whether the feature does what was actually asked for.

Fetch every PR from GitHub and inspect its current head, diff, checks, existing
threads, and cross-repository assumptions. Review all URLs before deciding.

This sandbox persists across review rounds for this issue, so checkouts from an
earlier round may already be on disk. Re-fetch every PR head instead of
trusting what you find there.

Post your findings on every pull request before you return a verdict:

    gh pr review <pr-url> --comment --body "<findings>"

Use --comment; GitHub blocks --approve and --request-changes on self-authored
pull requests. Do not use orchestration labels.

Return approved only when every PR passes and the combined feature is
consistent. Return needs_changes when any actionable code change is needed.
Return blocked only when review cannot complete because required information
or infrastructure is unavailable.
"""

[[run.tasks.steps]]
name = "pause-sandbox"
pause = true
