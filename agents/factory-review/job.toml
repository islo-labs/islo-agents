[job]
name = "factory-review"
version = "0.2.0"
description = "Review every pull request in a feature as one aggregate change."

[job.params.issue_id]
type = "string"
required = true
description = "Linear issue identifier or UUID."

[job.params.pull_requests]
type = "array"
items = "string"
required = true
description = "Complete list of GitHub pull request URLs for the feature."

[job.params.model]
type = "string"
default = "claude-opus-4-6"
description = "Model name for the agent harness."

[outputs.review_result]
type = "string"
required = true
enum = ["approved", "needs_changes", "blocked"]

[run]
fail_fast = true
fanout = false
timeout = 7200
workdir = "/workspace"
teardown_on_complete = false

[run.sandbox]
mode = "ensure"
name = "factory-review-{{issue_id}}"
image = "docker.io/library/islo-runner:latest"
snapshot_name = "islo-code"
vcpus = 4
memory_mb = 8192
gateway_profile = "default"
init = { type = "full" }

[run.sandbox.lifecycle]
pause_after_idle = 1800
delete_after = 604800

[[run.tasks]]
name = "review"

[[run.tasks.steps]]
name = "run-agent"
timeout = 7200

[run.tasks.steps.run_agent]
mode = "session"
harness = "claude"
model = "{{model}}"
prompt_ref = "factory-review-prompt"
resume_prompt = "The pull requests have been updated. Review the latest changes across all PRs."
knowledge = ["islo-integrations"]
session = "factory-review-{{issue_id}}"

[[run.tasks.steps]]
name = "pause-sandbox"
pause = true
