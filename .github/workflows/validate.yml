name: Validate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  # Secret-free, so it runs on fork PRs too. Line manifests are structurally
  # validated here rather than with `islo factory line validate`, because that
  # command resolves each stage's `job` against deployed tenant state and so
  # fails for any template not already deployed on the CI tenant.
  validate-examples:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Validate example packages
        run: python3 scripts/validate_examples.py

  # Job manifests get a real API dry-run, because the API silently accepts
  # unknown keys in most job.toml sections and only a deploy can resolve
  # prompt bindings. Fork PRs cannot read repo secrets, so they skip.
  dry-run-jobs:
    runs-on: ubuntu-latest
    needs: validate-examples
    if: ${{ github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository }}
    env:
      ISLO_API_KEY: ${{ secrets.ISLO_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      # The installer defaults to $HOME/.local/bin, which later steps do not
      # have on PATH until it is added to $GITHUB_PATH.
      - name: Install islo CLI
        if: ${{ env.ISLO_API_KEY != '' }}
        run: |
          curl -fsSL https://islo.dev/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Dry-run every job manifest
        run: |
          if [ -z "${ISLO_API_KEY:-}" ]; then
            echo "ISLO_API_KEY is not available; skipping API dry-run."
            exit 0
          fi
          failed=""
          for manifest in examples/*/jobs/*/job.toml; do
            name="$(basename "$(dirname "$manifest")")"
            # A knowledge-slug prompt binding only resolves once the tenant holds
            # that item, so gating on it would test tenant state, not the repo.
            # These are tracked by PENDING_PROMPT_SOURCE_MIGRATION in
            # scripts/validate_examples.py; the skip disappears as they convert.
            if grep -q 'type = "knowledge"' "$manifest"; then
              echo "skip $name (prompt bound to a knowledge slug)"
              continue
            fi
            echo "::group::$name"
            if islo job deploy "$name" --path "$manifest" --dry-run; then
              echo "ok   $name"
            else
              echo "FAIL $name"
              failed="$failed $manifest"
            fi
            echo "::endgroup::"
          done
          if [ -n "$failed" ]; then
            echo "job manifests that failed --dry-run:"
            for manifest in $failed; do
              echo "  $manifest"
            done
            exit 1
          fi
          echo "all job manifests passed --dry-run"
