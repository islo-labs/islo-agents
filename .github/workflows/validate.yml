name: Validate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  # Validate local Agent packages without credentials or deployed tenant state.
  validate-examples:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Validate example packages
        run: |
          python3 scripts/validate_examples.py
          python3 -m unittest discover -s scripts -p 'test_*.py'
