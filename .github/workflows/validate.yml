name: Validate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  # Required on every PR (including forks). No secrets or tenant API access.
  validate-examples:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate example packages
        run: python3 scripts/validate_examples.py

  # Advisory only. Requires ISLO_API_KEY and a trusted ref (not fork PRs).
  # factory line validate and job deploy --dry-run both call the API via auth_token().
  validate-cli:
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'push' ||
      github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v4

      - name: Install Islo CLI
        run: curl -fsSL https://islo.dev/install.sh | bash

      - name: Validate line manifests (API)
        env:
          ISLO_API_KEY: ${{ secrets.ISLO_API_KEY }}
        run: |
          if [ -z "${ISLO_API_KEY:-}" ]; then
            echo "ISLO_API_KEY not set — skipping islo factory line validate"
            exit 0
          fi
          failed=0
          for line in examples/*/line.toml; do
            echo "::group::Validating ${line}"
            if islo factory line validate "$line"; then
              echo "OK"
            else
              echo "::error::${line} validation failed"
              failed=1
            fi
            echo "::endgroup::"
          done
          exit $failed
