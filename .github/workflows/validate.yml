name: Validate

on:
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Tests
        run: npm test

      - name: Assemble webhooks
        run: npm run assemble-webhooks

      - name: Install Islo CLI
        run: curl -fsSL https://islo.dev/install.sh | bash

      - name: Validate job manifests
        env:
          ISLO_API_KEY: ${{ secrets.ISLO_API_KEY }}
        run: |
          failed=0
          for dir in agents/*/; do
            role="$(basename "$dir")"
            manifest="${dir}job.toml"
            [ -f "$manifest" ] || continue
            echo "::group::Validating ${role}"
            mkdir -p "jobs/${role}"
            cp "$manifest" "jobs/${role}/job.toml"
            if islo job deploy "${role}" --dry-run; then
              echo "OK"
            else
              echo "::error::${role} manifest validation failed"
              failed=1
            fi
            echo "::endgroup::"
          done
          exit $failed

      - name: Validate line manifests
        env:
          ISLO_API_KEY: ${{ secrets.ISLO_API_KEY }}
        run: |
          failed=0
          for manifest in lines/*/line.toml; do
            [ -f "$manifest" ] || continue
            name="$(basename "$(dirname "$manifest")")"
            echo "::group::Validating ${name}"
            if islo factory line deploy "$manifest" --dry-run; then
              echo "OK"
            else
              echo "::error::${name} manifest validation failed"
              failed=1
            fi
            echo "::endgroup::"
          done
          exit $failed
