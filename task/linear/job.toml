[job]
name = "linear-task"
version = "0.1.0"
description = "Execute a task from Linear with real-time activity emission."

[job.params.issue_id]
type = "string"
required = true
description = "Linear issue ID."

[job.params.issue_title]
type = "string"
required = true
description = "Issue title."

[job.params.issue_description]
type = "string"
default = ""
description = "Issue description/body."

[job.params.session_id]
type = "string"
required = true
description = "Linear agent session ID for activity emission."

[job.params.team_key]
type = "string"
required = true
description = "Linear team key (used for sandbox naming)."

[job.params.labels]
type = "string"
default = ""
description = "Comma-separated label names from the issue."

[job.params.assignee]
type = "string"
default = ""
description = "Assignee name."

[job.params.guidance]
type = "string"
default = ""
description = "Optional guidance rules from the Linear agent configuration."

[job.params.agents_ref]
type = "string"
default = "v1"
description = "islo-agents git ref to run."
pattern = "^[a-zA-Z0-9._/@^~-]+$"

[job.params.model]
type = "string"
default = "claude-opus-4-6"
description = "Claude model for the task agent."

[job.params.max_turns]
type = "integer"
default = 100
description = "Maximum agentic turns."

[job.params.max_budget_usd]
type = "number"
default = 15
description = "Maximum budget in USD."

[run]
fail_fast = true
fanout = false
timeout = 3600
workdir = "/workspace"
teardown_on_complete = false

[run.sandbox]
mode = "ensure"
name = "linear-task-{{team_key}}"
image = "docker.io/library/islo-runner:latest"
snapshot_name = "islo-stack"
vcpus = 4
memory_mb = 4096
gateway_profile = "default"
init = { type = "full" }

[run.sandbox.lifecycle]
pause_after_idle = 1800
delete_after = 604800

[[run.tasks]]
name = "linear-task"

[[run.tasks.steps]]
name = "run-agent"
timeout = 3600
exec = [
  "bash",
  "-lc",
  '''
set -euo pipefail
cd /workspace
rm -rf islo-agents
git clone --depth=1 --no-checkout https://github.com/islo-labs/islo-agents.git
cd islo-agents
git fetch --depth=1 origin "{{agents_ref}}"
git -c advice.detachedHead=false checkout FETCH_HEAD
npm ci
npx tsx task/linear/agent.ts \
  --prompt task/prompt.md \
  --cwd /workspace \
  --session-id "{{session_id}}" \
  --session-key "linear-{{issue_id}}" \
  --model "{{model}}" \
  --max-turns "{{max_turns}}" \
  --max-budget "{{max_budget_usd}}" \
  --var ISSUE_TITLE="{{issue_title}}" \
  --var ISSUE_DESCRIPTION="{{issue_description}}" \
  --var GUIDANCE="{{guidance}}"
''',
]

[[run.tasks.steps]]
name = "pause-sandbox"
pause = true
