[job]
name = "linear-task"
version = "0.3.0"
description = "Implement a Linear issue triggered by adding the 'islo' label."

[job.params.issue_id]
type = "string"
required = true
description = "Linear issue UUID."

[job.params.issue_title]
type = "string"
default = ""
description = "Issue title."

[job.params.issue_description]
type = "string"
default = ""
description = "Issue description/body."

[job.params.issue_identifier]
type = "string"
default = ""
description = "Human-readable issue identifier (e.g. ENG-123)."

[job.params.issue_url]
type = "string"
default = ""
description = "URL of the issue in Linear."

[job.params.raw_payload]
type = "string"
required = true
description = "Full webhook payload JSON for the guard step."

[job.params.agents_ref]
type = "string"
default = "v1"
description = "islo-agents git ref to run."
pattern = "^[a-zA-Z0-9._/@^~-]+$"

[job.params.model]
type = "string"
default = "claude-sonnet-4-5"
description = "Claude model for the task agent."

[job.params.max_turns]
type = "integer"
default = 100
description = "Maximum agentic turns."

[job.params.max_budget_usd]
type = "number"
default = 15
description = "Maximum budget in USD."

[run]
fail_fast = true
fanout = false
timeout = 3600
workdir = "/workspace"
teardown_on_complete = false

[run.sandbox]
mode = "ensure"
name = "linear-task-{{issue_id}}"
image = "docker.io/library/islo-runner:latest"
snapshot_name = "islo-stack"
vcpus = 4
memory_mb = 4096
gateway_profile = "default"
init = { type = "full" }

[run.sandbox.lifecycle]
pause_after_idle = 1800
delete_after = 604800

[[run.tasks]]
name = "linear-task"

[[run.tasks.steps]]
name = "label-guard"
timeout = 10
exec = [
  "bash",
  "-lc",
  '''
PAYLOAD='{{raw_payload}}'

# Not a label change? Reject.
jq -e '.updatedFrom.labelIds' <<< "$PAYLOAD" >/dev/null 2>&1 || { echo "not a label change"; exit 1; }

# Get islo's label ID from current labels (has names)
ISLO_ID=$(jq -r '.data.labels[]? | select(.name == "islo") | .id' <<< "$PAYLOAD")

# islo not on the issue? Reject.
[ -z "$ISLO_ID" ] && { echo "islo label not on issue"; exit 1; }

# islo was already there before? Reject.
jq -e --arg id "$ISLO_ID" '.updatedFrom.labelIds[] | select(. == $id)' <<< "$PAYLOAD" >/dev/null 2>&1 && { echo "islo label was already present"; exit 1; }

echo "islo label just added -- proceeding"
''',
]

[[run.tasks.steps]]
name = "run-agent"
timeout = 3600
exec = [
  "bash",
  "-lc",
  '''
set -euo pipefail
cd /workspace
rm -rf islo-agents
git clone --depth=1 --no-checkout https://github.com/islo-labs/islo-agents.git
cd islo-agents
git fetch --depth=1 origin "{{agents_ref}}"
git -c advice.detachedHead=false checkout FETCH_HEAD
npm ci
npx tsx src/agent.ts \
  --prompt task/linear/prompt.md \
  --cwd /workspace \
  --session-key "linear-{{issue_id}}" \
  --model "{{model}}" \
  --max-turns "{{max_turns}}" \
  --max-budget "{{max_budget_usd}}" \
  --var ISSUE_ID="{{issue_id}}" \
  --var ISSUE_TITLE="{{issue_title}}" \
  --var ISSUE_DESCRIPTION="{{issue_description}}" \
  --var ISSUE_IDENTIFIER="{{issue_identifier}}" \
  --var ISSUE_URL="{{issue_url}}"
''',
]

[[run.tasks.steps]]
name = "pause-sandbox"
pause = true
