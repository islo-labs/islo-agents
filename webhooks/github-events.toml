op = "all"

[[rules.when.conditions]]
op = "exists"
json_path = "$.pull_request"

[[rules.when.conditions]]
op = "equals"
json_path = "$.action"
value = "opened"

[[rules.when.conditions]]
op = "not"

[rules.when.conditions.condition]
op = "equals"
json_path = "$.pull_request.user.login"
value = "islo-labs[bot]"

[[rules.actions]]
action_type = "trigger_job"
